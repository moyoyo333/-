<style>

<script>

/* =========================================================
   エラー監視
========================================================= */

window.addEventListener(
  "error",
  function(e) {

    showError(
      "JavaScript ERROR\n\n" +
      e.message +
      "\n\nLINE: " +
      e.lineno
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  function(e) {

    showError(
      "Promise ERROR\n\n" +
      e.reason
    );

  }
);


function showError(message) {

  console.error(message);

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display = "block";

  box.textContent = message;

}


/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "https://zuwhkhsviqfitfzpgcdy.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_E09QP-l02lAr14I3p04wHg_2-1nE1TM";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   データ
========================================================= */

let people = [];

let selectedCards = [];

let lock = false;

let remainingPairs = 0;

let moves = 0;


/* =========================================================
   切り抜き用データ
========================================================= */

let cropState = {

  mode: "new",

  person: null,

  image: null,

  file: null,

  imageDataUrl: null,

  sourceImage: null,

  scale: 1,

  offsetX: 0,

  offsetY: 0,

  dragging: false,

  startX: 0,

  startY: 0,

  startOffsetX: 0,

  startOffsetY: 0

};


/* =========================================================
   サイト開始
========================================================= */

async function enterSite() {

  document
    .getElementById(
      "startScreen"
    )
    .style.display = "none";


  await loadPeople();

}


/* =========================================================
   人物・画像読み込み
========================================================= */

async function loadPeople() {

  try {

    const {
      data: peopleData,
      error: peopleError
    } =
      await supabaseClient
        .from("people")
        .select("*")
        .order(
          "id",
          {
            ascending: true
          }
        );


    if (peopleError) {

      console.error(
        peopleError
      );

      showError(
        "人物データの読み込みエラー\n\n" +
        peopleError.message
      );

      return;

    }


    const {
      data: imageData,
      error: imageError
    } =
      await supabaseClient
        .from("person_images")
        .select("*");


    if (imageError) {

      console.error(
        imageError
      );

      showError(
        "画像データの読み込みエラー\n\n" +
        imageError.message
      );

      return;

    }


    people =
      (peopleData || []).map(
        person => {

          const images =
            (imageData || [])
              .filter(
                image =>
                  String(image.person_id) ===
                  String(person.id)
              )
              .map(
                image => {

                  const {
                    data
                  } =
                    supabaseClient
                      .storage
                      .from("images")
                      .getPublicUrl(
                        image.image_path
                      );


                  return {

                    id:
                      image.id,

                    path:
                      image.image_path,

                    url:
                      data.publicUrl

                  };

                }
              );


          return {

            ...person,

            images:
              images

          };

        }
      );


    renderPeople();


  }

  catch(error) {

    console.error(error);

    showError(
      "データ読み込み中にエラーが発生しました\n\n" +
      error.message
    );

  }

}


/* =========================================================
   人物追加
========================================================= */

async function addPerson() {

  const input =
    document.getElementById(
      "personName"
    );


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "人物名を入力してください"
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("people")
      .insert({

        name:
          name

      });


  if (error) {

    alert(
      "人物の追加に失敗しました\n\n" +
      error.message
    );

    return;

  }


  input.value = "";


  await loadPeople();

}


/* =========================================================
   人物削除
========================================================= */

async function deletePerson(person) {

  if (
    !confirm(
      `「${person.name}」を削除しますか？`
    )
  ) {

    return;

  }


  const paths =
    person.images.map(
      image =>
        image.path
    );


  if (paths.length > 0) {

    const {
      error
    } =
      await supabaseClient
        .storage
        .from("images")
        .remove(
          paths
        );


    if (error) {

      console.error(
        "Storage delete error",
        error
      );

    }

  }


  const {
    error
  } =
    await supabaseClient
      .from("person_images")
      .delete()
      .eq(
        "person_id",
        person.id
      );


  if (error) {

    alert(
      "画像情報の削除に失敗しました\n\n" +
      error.message
    );

    return;

  }


  const {
    error: personError
  } =
    await supabaseClient
      .from("people")
      .delete()
      .eq(
        "id",
        person.id
      );


  if (personError) {

    alert(
      "人物の削除に失敗しました\n\n" +
      personError.message
    );

    return;

  }


  await loadPeople();

}


/* =========================================================
   画像一覧表示
========================================================= */

function renderPeople() {

  const list =
    document.getElementById(
      "personList"
    );


  list.innerHTML = "";


  people.forEach(
    person => {

      const personDiv =
        document.createElement(
          "div"
        );


      personDiv.className =
        "person";


      /* -------------------------
         ヘッダー
      ------------------------- */

      const header =
        document.createElement(
          "div"
        );


      header.className =
        "person-header";


      const title =
        document.createElement(
          "h3"
        );


      title.textContent =
        `${person.name}（画像 ${person.images.length}枚）`;


      header.appendChild(
        title
      );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.textContent =
        "人物を削除";


      deleteButton.className =
        "delete-button";


      deleteButton.onclick =
        () =>
          deletePerson(
            person
          );


      header.appendChild(
        deleteButton
      );


      personDiv.appendChild(
        header
      );


      /* -------------------------
         画像追加
      ------------------------- */

      const fileInput =
        document.createElement(
          "input"
        );


      fileInput.type =
        "file";

      fileInput.accept =
        "image/*";

      fileInput.multiple =
        true;


      fileInput.onchange =
        async function(e) {

          const files =
            Array.from(
              e.target.files
            );


          if (!files.length) {
            return;
          }


          fileInput.disabled =
            true;


          for (
            const file
            of files
          ) {

            await openCropForNewImage(
              person,
              file
            );

          }


          fileInput.value = "";

          fileInput.disabled =
            false;

        };


      personDiv.appendChild(
        fileInput
      );


      /* -------------------------
         画像一覧
      ------------------------- */

      const imageList =
        document.createElement(
          "div"
        );


      imageList.className =
        "image-list";


      person.images.forEach(
        image => {

          const imageBox =
            document.createElement(
              "div"
            );


          imageBox.className =
            "image-box";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            image.url;


          img.onerror =
            function() {

              img.alt =
                "画像を読み込めません";

            };


          imageBox.appendChild(
            img
          );


          const buttons =
            document.createElement(
              "div"
            );


          buttons.className =
            "image-buttons";


          /* 切り抜き変更 */

          const cropButton =
            document.createElement(
              "button"
            );


          cropButton.textContent =
            "✂️ 切り抜き";


          cropButton.onclick =
            () =>
              openCropForExistingImage(
                person,
                image
              );


          buttons.appendChild(
            cropButton
          );


          /* 削除 */

          const deleteImageButton =
            document.createElement(
              "button"
            );


          deleteImageButton.textContent =
            "× 削除";


          deleteImageButton.className =
            "delete-button";


          deleteImageButton.onclick =
            () =>
              deleteImage(
                image
              );


          buttons.appendChild(
            deleteImageButton
          );


          imageBox.appendChild(
            buttons
          );


          imageList.appendChild(
            imageBox
          );

        }
      );


      personDiv.appendChild(
        imageList
      );


      list.appendChild(
        personDiv
      );

    }
  );


  updateCounts();

}


/* =========================================================
   統計
========================================================= */

function updateCounts() {

  const imageCount =
    people.reduce(
      (
        total,
        person
      ) =>
        total +
        person.images.length,
      0
    );


  document
    .getElementById(
      "personCount"
    )
    .textContent =
    people.length;


  document
    .getElementById(
      "imageCount"
    )
    .textContent =
    imageCount;

}


/* =========================================================
   File → Data URL
========================================================= */

function fileToDataURL(file) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        () =>
          reject(
            reader.error
          );


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   切り抜き用画像読み込み
========================================================= */

function loadImageFromDataURL(
  dataUrl
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();


      img.onload =
        () =>
          resolve(
            img
          );


      img.onerror =
        () =>
          reject(
            new Error(
              "画像を読み込めませんでした"
            )
          );


      img.src =
        dataUrl;

    }
  );

}


/* =========================================================
   新規画像の切り抜き
========================================================= */

async function openCropForNewImage(
  person,
  file
) {

  try {

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      alert(
        "画像ファイルを選択してください"
      );

      return;

    }


    const dataUrl =
      await fileToDataURL(
        file
      );


    const img =
      await loadImageFromDataURL(
        dataUrl
      );


    cropState = {

      mode:
        "new",

      person:
        person,

      image:
        null,

      file:
        file,

      imageDataUrl:
        dataUrl,

      offsetX:

      offsetY:
        0,

      dragging:
        false,

      startX:
        0,

      startY:
        0,

      startOffsetX:
        0,

    };

}

        0,

/* =========================================================
   切り抜き画面表示
========================================================= */

function showCropModal() {

/* =========================================================
   切り抜き四角を初期配置
========================================================= */

function setupCropSquare() {

  const area =
    document.getElementById(
      "cropArea"
    );


  const image =
    document.getElementById(
      "cropImage"
    );


  const square =
    document.getElementById(
      "cropSquare"
    );


  const imageRect =
    image.getBoundingClientRect();


  const areaRect =
    area.getBoundingClientRect();


  const size =
    Math.min(
      imageRect.width,
      imageRect.height
    ) * 0.65;


  square.style.width =
    size + "px";


  square.style.height =
    size + "px";


  square.style.left =
    (
      imageRect.left -
      areaRect.left +
      (
        imageRect.width -
        size
      ) / 2
    ) + "px";


  square.style.top =
    (
      imageRect.top -
      areaRect.top +
      (
        imageRect.height -
        size
      ) / 2
    ) + "px";


  cropState.offsetX = 0;
  cropState.offsetY = 0;

}


/* =========================================================
   切り抜き四角のドラッグ
========================================================= */

const cropSquare =
  document.getElementById(
    "cropSquare"
  );


cropSquare.addEventListener(
  "pointerdown",
  function(e) {

    e.preventDefault();

    cropState.dragging =
      true;

    cropState.startX =
      e.clientX;

    cropState.startY =
      e.clientY;

    const left =
      parseFloat(
        cropSquare.style.left
      ) || 0;

    const top =
      parseFloat(
        cropSquare.style.top
      ) || 0;

    cropState.startOffsetX =
      left;

    cropState.startOffsetY =
      top;


    cropSquare.setPointerCapture(
      e.pointerId
    );

  }
);


cropSquare.addEventListener(
  "pointermove",
  function(e) {

    if (
      !cropState.dragging
    ) {
      return;
    }


    const area =
      document.getElementById(
        "cropArea"
      );


    const image =
      document.getElementById(
        "cropImage"
      );


    const areaRect =
      area.getBoundingClientRect();


    const imageRect =
      image.getBoundingClientRect();


    const squareSize =
      cropSquare.offsetWidth;


    let left =
      cropState.startOffsetX +
      (
        e.clientX -
        cropState.startX
      );


    let top =
      cropState.startOffsetY +
      (
        e.clientY -
        cropState.startY
      );


    const minLeft =
      imageRect.left -
      areaRect.left;


    const minTop =
      imageRect.top -
      areaRect.top;


    const maxLeft =
      minLeft +
      imageRect.width -
      squareSize;


    const maxTop =
      minTop +
      imageRect.height -
      squareSize;


    left =
      Math.max(
        minLeft,
        Math.min(
          maxLeft,
          left
        )
      );


    top =
      Math.max(
        minTop,
        Math.min(
          maxTop,
          top
        )
      );


    cropSquare.style.left =
      left + "px";


    cropSquare.style.top =
      top + "px";

  }
);


cropSquare.addEventListener(
  "pointerup",
  function() {

    cropState.dragging =
      false;

  }
);


/* =========================================================
   ズーム
========================================================= */

document
  .getElementById(
    "zoomRange"
  )
  .addEventListener(
    "input",
    function() {

      const zoom =
        parseFloat(

        );

/* =========================================================
   切り抜きキャンセル
========================================================= */

function closeCropModal() {

  document
    .getElementById(
      "cropModal"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "cropImage"
    )
    .style.transform =

  cropState =
    {

      mode:

      person:

      image:
        null,

      file:
        null,

      imageDataUrl:
        null,

      sourceImage:
        null

    };

}


/* =========================================================
   正方形切り抜き
========================================================= */

async function createCroppedBlob() {

  const image =
    cropState.sourceImage;


  const cropImage =
    document.getElementById(
      "cropImage"
    );


  const square =
    document.getElementById(
      "cropSquare"
    );


  const imageRect =
    cropImage.getBoundingClientRect();


  const squareRect =
    square.getBoundingClientRect();


  /*
    画面上での切り抜き位置
  */

  let sx =
    (
      squareRect.left -
      imageRect.left
    ) *
    (
      image.naturalWidth /
      imageRect.width
    );


  let sy =
    (
      squareRect.top -
      imageRect.top
    ) *
    (
      image.naturalHeight /
      imageRect.height
    );


  let size =
    squareRect.width *
    (
      image.naturalWidth /
      imageRect.width
    );


  /*
    範囲補正
  */

  sx =
    Math.max(
      0,
      Math.min(
        image.naturalWidth - size,
        sx
      )
    );


  sy =
    Math.max(
      0,
      Math.min(
        image.naturalHeight - size,
        sy
      )
    );


  size =
    Math.min(
      size,
      image.naturalWidth - sx,
      image.naturalHeight - sy
    );


  /*
    出力サイズ
  */

  const outputSize =
    800;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    outputSize;


  canvas.height =
    outputSize;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.imageSmoothingEnabled =
    true;


  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    image,

    sx,
    sy,
    size,
    size,

    0,
    0,
    outputSize,
    outputSize

  );


  return new Promise(
    resolve => {

      canvas.toBlob(
        blob => {

          resolve(blob);

        },
        "image/jpeg",
        0.88
      );

    }
  );

}


/* =========================================================
   切り抜き保存
========================================================= */

async function saveCrop() {

  const saveButton =
    document.querySelector(
      "#cropModal .crop-buttons button:last-child"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "保存中...";


  try {

    const blob =
      await createCroppedBlob();


    if (!blob) {

      throw new Error(
        "切り抜き画像の作成に失敗しました"
      );

    }


    /*
    =========================
    新規画像
    =========================
    */

    if (
      cropState.mode ===
      "new"
    ) {

      const person =
        cropState.person;


      const fileName =
        `${person.id}/${Date.now()}-${Math.random()
          .toString(36)
          .substring(2)}.jpg`;


      const {
        error:
          uploadError
      } =
        await supabaseClient
          .storage
          .from("images")
          .upload(
            fileName,
            blob,
            {

              contentType:
                "image/jpeg",

              upsert:
                false

            }
          );


      if (uploadError) {

        throw uploadError;

      }


      const {
        error:
          dbError
      } =
        await supabaseClient
          .from("person_images")
          .insert({

            person_id:
              person.id,

            image_path:
              fileName

          });


      if (dbError) {

        /*
          DB保存失敗時はStorage画像を削除
        */

        await supabaseClient
          .storage
          .from("images")
          .remove([
            fileName
          ]);


        throw dbError;

      }

    }


    /*
    =========================
    既存画像
    =========================
    */

    else {

      const oldImage =
        cropState.image;


      const newFileName =
        `${cropState.person.id}/${Date.now()}-${Math.random()
          .toString(36)
          .substring(2)}.jpg`;


      const {
        error:
          uploadError
      } =
        await supabaseClient
          .storage
          .from("images")
          .upload(
            newFileName,
            blob,
            {

              contentType:
                "image/jpeg",

              upsert:
                false

            }
          );


      if (uploadError) {

        throw uploadError;

      }


      /*
      DBの画像パスを更新
      */

      const {
        error:
          updateError
      } =
        await supabaseClient
          .from("person_images")
          .update({

            image_path:
              newFileName

          })
          .eq(
            "id",
            oldImage.id
          );


      if (updateError) {

        await supabaseClient
          .storage
          .from("images")
          .remove([
            newFileName
          ]);

        throw updateError;

      }


      /*
      古いStorage画像削除
      */

      const {
        error:
          oldDeleteError
      } =
        await supabaseClient
          .storage
          .from("images")
          .remove([
            oldImage.path
          ]);


      if (oldDeleteError) {

        console.warn(
          "古い画像削除失敗",
          oldDeleteError
        );

      }

    }


    closeCropModal();


    await loadPeople();


  }

  catch(error) {

    console.error(error);

    alert(
      "画像の保存に失敗しました\n\n" +
      error.message
    );

  }

  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      "✂️ この範囲で保存";

  }

}


/* =========================================================
   画像削除
========================================================= */

async function deleteImage(image) {

  if (
    !confirm(
      "この画像を削除しますか？"
    )
  ) {

    return;

  }


  const {
    error:
      storageError
  } =
    await supabaseClient
      .storage
      .from("images")
      .remove([
        image.path
      ]);


  if (storageError) {

    alert(
      "Storage画像の削除に失敗しました\n\n" +
      storageError.message
    );

    return;

  }


  const {
    error:
      dbError
  } =
    await supabaseClient
      .from("person_images")
      .delete()
      .eq(
        "id",
        image.id
      );


  if (dbError) {

    alert(
      "画像情報の削除に失敗しました\n\n" +
      dbError.message
    );

    return;

  }


  await loadPeople();

}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(array) {

  for (
    let i =
      array.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================================================
   ゲーム開始
========================================================= */

function startGame() {

  const usablePeople =
    people.filter(
      person =>
        person.images.length >= 2
    );


  if (
    usablePeople.length === 0
  ) {

    alert(
      "最低1人、画像を2枚以上登録してください。"
    );

    return;

  }


  let cards = [];


  usablePeople.forEach(
    person => {

      const images =
        shuffle(
          [...person.images]
        );


      const selected =
        images.slice(
          0,
          2
        );


      selected.forEach(
        image => {

          cards.push({

            person:
              person.name,

            image:
              image.url

          });

        }
      );

    }
  );


  shuffle(cards);


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "game"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";


  const board =
    document.getElementById(
      "board"
    );


  board.innerHTML =
    "";


  selectedCards = [];

  lock = false;

  moves = 0;

  remainingPairs =
    usablePeople.length;


  updateStatus();


  cards.forEach(
    card => {

      const cardElement =
        document.createElement(
          "div"
        );


      cardElement.className =
        "card";


      cardElement.dataset.person =
        card.person;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        card.image;


      img.className =
        "hidden-image";


      cardElement.appendChild(
        img
      );


      cardElement.onclick =
        () =>
          flipCard(
            cardElement
          );


      board.appendChild(
        cardElement
      );

    }
  );

}


/* =========================================================
   ステータス
========================================================= */

function updateStatus() {

  document
    .getElementById(
      "remainingDisplay"
    )
    .textContent =
    remainingPairs;


  document
    .getElementById(
      "movesDisplay"
    )
    .textContent =
    moves;

}


/* =========================================================
   カードをめくる
========================================================= */

function flipCard(card) {

  if (lock) {
    return;
  }


  if (
    card.classList.contains(
      "completed"
    )
  ) {
    return;
  }


  if (
    selectedCards.includes(
      card
    )
  ) {
    return;
  }


  const img =
    card.querySelector(
      "img"
    );


  img.classList.remove(
    "hidden-image"
  );


  card.classList.add(
    "revealed"
  );


  selectedCards.push(
    card
  );


  if (
    selectedCards.length === 2
  ) {

    moves++;

    updateStatus();

    lock = true;


    setTimeout(
      checkPair,
      800
    );

  }

}


/* =========================================================
   ペア判定
========================================================= */

function checkPair() {

  const card1 =
    selectedCards[0];


  const card2 =
    selectedCards[1];


  if (!card1 || !card2) {

    selectedCards = [];

    lock = false;

    return;

  }


  const person1 =
    card1.dataset.person;


  const person2 =
    card2.dataset.person;


  if (
    person1 === person2
  ) {

    card1.classList.add(
      "completed"
    );


    card2.classList.add(
      "completed"
    );


    remainingPairs--;


    updateStatus();


    if (
      remainingPairs === 0
    ) {

      document
        .getElementById(
          "message"
        )
        .innerHTML = `

          <div class="clear-box">

            <h2>
              🎉 GAME CLEAR！
            </h2>

            <p>
              ${moves}回でクリアしました！
            </p>

            <button
              onclick="startGame()"
            >
              もう一度遊ぶ
            </button>

            <button
              onclick="backToEditor()"
            >
              編集画面へ
            </button>

          </div>

        `;

    }

  }

  else {

    card1
      .querySelector("img")
      .classList.add(
        "hidden-image"
      );


    card2
      .querySelector("img")
      .classList.add(
        "hidden-image"
      );


    card1.classList.remove(
      "revealed"
    );


    card2.classList.remove(
      "revealed"
    );

  }


  selectedCards = [];

  lock = false;

}


/* =========================================================
   編集画面に戻る
========================================================= */

function backToEditor() {

  document
    .getElementById(
      "game"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";

}

document

  )
  .addEventListener(

      if (

      ) {

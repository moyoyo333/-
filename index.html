<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>人物でそろえる神経衰弱 TEST123</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        "Noto Sans JP",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8f9ff
        );

      color: #222;
      min-height: 100vh;
    }


    /* =========================
       ヘッダー
    ========================= */

    header {
      text-align: center;
      padding: 30px 20px 25px;

      background:
        linear-gradient(
          135deg,
          #4169e1,
          #7b68ee
        );

      color: white;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }


    /* =========================
       全体コンテナ
    ========================= */

    .container {
      width: min(95%, 1000px);
      margin: 25px auto 50px;
    }


    /* =========================
       パネル
    ========================= */

    .panel {
      background: white;

      padding: 24px;

      border-radius: 20px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.08);

      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }


    /* =========================
       統計
    ========================= */

    .stats,
    .game-stats {
      display: flex;
      justify-content: center;
      gap: 15px;

      flex-wrap: wrap;

      margin: 20px auto;

      padding: 0 15px;
    }

    .stat-box,
    .stat-card {
      background: white;

      min-width: 130px;

      padding: 15px 20px;

      border-radius: 16px;

      text-align: center;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.08);

      transition: transform .2s;
    }

    .stat-box:hover,
    .stat-card:hover {
      transform: translateY(-3px);
    }

    .stat-box span,
    .stat-card span {
      display: block;

      font-size: 28px;
      font-weight: bold;

      color: #4169e1;
    }

    small {
      color: #666;
    }


    /* =========================
       入力欄
    ========================= */

    input[type="text"] {
      width: min(300px, 100%);

      padding: 12px 14px;

      font-size: 16px;

      border: 2px solid #ddd;

      border-radius: 10px;

      outline: none;

      transition: border .2s;
    }

    input[type="text"]:focus {
      border-color: #4169e1;
    }

    input[type="file"] {
      margin-top: 10px;
      max-width: 100%;
    }


    /* =========================
       ボタン
    ========================= */

    button {
      padding: 11px 18px;

      margin: 5px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #4169e1,
          #6a5acd
        );

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform .2s,
        opacity .2s,
        box-shadow .2s;

      box-shadow:
        0 4px 10px
        rgba(65,105,225,.25);
    }

    button:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    button:active {
      transform: scale(.97);
    }


    /* =========================
       人物カード
    ========================= */

    .person {
      background: #fff;

      border: 1px solid #eee;

      border-radius: 18px;

      padding: 18px;

      margin-top: 18px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.07);
    }

    .person-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .person-header h3 {
      margin: 0;
    }


    /* =========================
       画像一覧
    ========================= */

    .image-list {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 15px;
    }

    .image-box {
      position: relative;

      width: 110px;
      height: 110px;
    }

    .image-box img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 12px;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,.15);
    }

    .delete-image {
      position: absolute;

      top: -8px;
      right: -8px;

      width: 30px;
      height: 30px;

      padding: 0;
      margin: 0;

      border-radius: 50%;

      background: #e53935;

      display: flex;

      justify-content: center;
      align-items: center;

      font-size: 18px;

      box-shadow:
        0 3px 8px
        rgba(0,0,0,.2);
    }


    /* =========================
       ゲーム盤面
    ========================= */

    .card-board {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(100px, 1fr)
        );

      gap: 12px;

      margin-top: 20px;
    }

    .card {
      position: relative;

      aspect-ratio: 1 / 1;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #4169e1,
          #7b68ee
        );

      cursor: pointer;

      overflow: hidden;

      box-shadow:
        0 5px 15px
        rgba(0,0,0,.15);

      transition:
        transform .25s,
        box-shadow .25s;
    }

    .card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 8px 20px
        rgba(0,0,0,.2);
    }


    /* カード裏面 */

    .card::before {
      content: "🃏";

      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      color: white;

      font-size: clamp(28px, 6vw, 45px);

      z-index: 2;
    }

    .card.revealed::before {
      display: none;
    }


    /* カード画像 */

    .card img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .hidden-image {
      display: none !important;
    }


    /* 揃ったカード */

    .completed {
      opacity: .45;

      pointer-events: none;

      transform: scale(.96);
    }


    /* =========================
       クリア画面
    ========================= */

    #message {
      text-align: center;

      font-size: 20px;

      margin-top: 25px;
    }

    .clear-box {
      background:
        linear-gradient(
          135deg,
          #fff,
          #f3f1ff
        );

      padding: 25px;

      border-radius: 20px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.1);

      animation: popup .4s ease;
    }

    @keyframes popup {

      from {
        opacity: 0;
        transform: scale(.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================
       スマホ
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 22px 15px;
      }

      h1 {
        font-size: 22px;
      }

      .panel {
        padding: 16px;
      }

      .card-board {
        grid-template-columns:
          repeat(3, 1fr);

        gap: 8px;
      }

      .card {
        border-radius: 12px;
      }

      .image-box {
        width: 90px;
        height: 90px;
      }

      .person-header {
        flex-direction: column;

        align-items: flex-start;
      }

      .stats,
      .game-stats {
        gap: 10px;
      }

      .stat-box,
      .stat-card {
        min-width: 110px;
      }

    }

  </style>
</head>


<body>

<header>

  <h1>
    人物でそろえる神経衰弱テスト2
  </h1>

  <p>
    画像が違っても同じ人物ならペア！
  </p>

</header>


<!-- 統計 -->

<div class="stats">

  <div class="stat-box">

    <span id="personCount">
      0
    </span>

    <small>
      人物数
    </small>

  </div>


  <div class="stat-box">

    <span id="imageCount">
      0
    </span>

    <small>
      画像数
    </small>

  </div>

</div>


<div class="container">


  <!-- 編集画面 -->

  <div
    id="editor"
    class="panel"
  >

    <h2>
      人物を追加
    </h2>


    <input
      type="text"
      id="personName"
      placeholder="人物名を入力"
    >


    <button onclick="addPerson()">

      人物を追加

    </button>


    <div id="personList"></div>


    <br>


    <button onclick="startGame()">

      🎮 ゲーム開始

    </button>

  </div>



  <!-- ゲーム画面 -->

  <div
    id="game"
    class="panel"
    style="display:none"
  >

    <button onclick="backToEditor()">

      ← 編集画面に戻る

    </button>


    <h2>
      神経衰弱
    </h2>


    <div class="game-stats">

      <div class="stat-card">

        <span id="remainingDisplay">
          0
        </span>

        <small>
          残り組数
        </small>

      </div>


      <div class="stat-card">

        <span id="movesDisplay">
          0
        </span>

        <small>
          挑戦回数
        </small>

      </div>

    </div>


    <div
      id="board"
      class="card-board"
    ></div>


    <div id="message"></div>

  </div>


</div>


<script>
document.body.innerHTML += "<h1>TEST JAVASCRIPT 999</h1>";
</script>

</body>
</html>

<script>
(function () {

  const startButton =
    document.getElementById("startButton");

  const startScreen =
    document.getElementById("startScreen");

  if (!startButton || !startScreen) {
    return;
  }

  startButton.addEventListener(
    "click",
    async function () {

      console.log("START BUTTON CLICK");

      startButton.disabled = true;
      startButton.textContent = "読み込み中...";

      /*
        まず画面を確実に消す
      */
      startScreen.style.display = "none";

      /*
        メインJavaScriptが読み込まれるまで少し待つ
      */
      setTimeout(async function () {

        try {

          if (
            typeof window.loadPeople !==
            "function"
          ) {

            throw new Error(
              "loadPeople() が読み込まれていません。\n" +
              "JavaScriptの途中でエラーが発生している可能性があります。"
            );

          }

          await window.loadPeople();

        }

        catch (error) {

          console.error(error);

          const errorBox =
            document.getElementById(
              "errorBox"
            );

          if (errorBox) {

            errorBox.style.display =
              "block";

            errorBox.textContent =
              "開始時エラー\n\n" +
              error.message;

          }

          /*
            エラー時には開始画面を戻す
          */

          startScreen.style.display =
            "flex";

          startButton.disabled =
            false;

          startButton.textContent =
            "🎮 始める";

        }

      }, 0);

    }

  );

})();
</script>

<script>

/* =========================================================
   Supabase設定
========================================================= */

const SUPABASE_URL =
  "https://zuwhkhsviqfitfzpgcdy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_E09QP-l02lAr14I3p04wHg_2-1nE1TM";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   データ
========================================================= */

let people = [];

let pendingImages = {};

let selectedCards = [];

let lock = false;

let remainingPairs = 0;

let moves = 0;

let imageDragging = false;

let dragStartX = 0;

let dragStartY = 0;

let dragStartImageLeft = 0;

let dragStartImageTop = 0;


/* =========================================================
   切り抜き状態
========================================================= */

let cropState = {

  mode: null,

  person: null,

  image: null,

  file: null,

  imageDataUrl: null,

  sourceImage: null,

  baseScale: 1,

  zoom: 1,

  imageLeft: 0,

  imageTop: 0,

  squareLeft: 0,

  squareTop: 0,

  squareSize: 0

};


/* =========================================================
   エラー表示
========================================================= */

function showError(message) {

  console.error(message);

  const box =
    document.getElementById(
      "errorBox"
    );

  if (!box) {
    return;
  }

  box.style.display = "block";

  box.textContent = message;

}


/* =========================================================
   JavaScriptエラー監視
========================================================= */

window.addEventListener(
  "error",
  function(event) {

    showError(
      "JavaScript ERROR\n\n" +
      event.message +
      "\n\nLINE: " +
      event.lineno
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  function(event) {

    showError(
      "Promise ERROR\n\n" +
      String(event.reason)
    );

  }
);


/* =========================================================
   サイト開始
========================================================= */

async function enterSite() {

  try {

    await loadPeople();

  }

  catch (error) {

    console.error(error);

    showError(
      "サイト開始時にエラーが発生しました\n\n" +
      error.message
    );

    throw error;

  }

}


/* =========================================================
   人物・画像読み込み
========================================================= */

async function loadPeople() {

  const {
    data: peopleData,
    error: peopleError
  } =
    await supabaseClient
      .from("people")
      .select("*")
      .order(
        "id",
        {
          ascending: true
        }
      );


  if (peopleError) {

    throw new Error(
      "人物データの読み込みエラー\n" +
      peopleError.message
    );

  }


  const {
    data: imageData,
    error: imageError
  } =
    await supabaseClient
      .from("person_images")
      .select("*");


  if (imageError) {

    throw new Error(
      "画像データの読み込みエラー\n" +
      imageError.message
    );

  }


  people =
    (peopleData || []).map(
      person => {

        const images =
          (imageData || [])
            .filter(
              image =>
                String(
                  image.person_id
                ) ===
                String(
                  person.id
                )
            )
            .map(
              image => {

                const {
                  data
                } =
                  supabaseClient
                    .storage
                    .from("images")
                    .getPublicUrl(
                      image.image_path
                    );


            return {
  id: image.id,
  path: image.image_path,
  url: data.publicUrl
};

              }
            );


        return {

          ...person,

          images:
            images

        };

      }
    );


  renderPeople();

}


/* =========================================================
   人物追加
========================================================= */

async function addPerson() {

  const input =
    document.getElementById(
      "personName"
    );


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "人物名を入力してください。"
    );

    input.focus();

    return;

  }


  const button =
    document.getElementById(
      "addPersonButton"
    );


  button.disabled =
    true;


  try {

    const {
      error
    } =
      await supabaseClient
        .from("people")
        .insert({

          name:
            name

        });


    if (error) {

      throw error;

    }


    input.value = "";

    await loadPeople();

  }

  catch(error) {

    console.error(error);

    alert(
      "人物の追加に失敗しました。\n\n" +
      error.message
    );

  }

  finally {

    button.disabled =
      false;

  }

}


/* =========================================================
   人物削除
========================================================= */

async function deletePerson(person) {

  if (
    !confirm(
      `「${person.name}」を削除しますか？`
    )
  ) {

    return;

  }


  try {

    delete pendingImages[
      person.id
    ];


    const paths =
      person.images
        .map(
          image =>
            image.path
        );


    if (paths.length > 0) {

      const {
        error
      } =
      await supabaseClient
        .storage
        .from("images")
        .remove(
          paths
        );


      if (error) {

        console.error(
          "Storage削除エラー",
          error
        );

      }

    }


    const {
      error: imageDbError
    } =
    await supabaseClient
      .from("person_images")
      .delete()
      .eq(
        "person_id",
        person.id
      );


    if (imageDbError) {

      throw imageDbError;

    }


    const {
      error: personError
    } =
    await supabaseClient
      .from("people")
      .delete()
      .eq(
        "id",
        person.id
      );


    if (personError) {

      throw personError;

    }


    await loadPeople();

  }

  catch(error) {

    console.error(error);

    alert(
      "人物の削除に失敗しました。\n\n" +
      error.message
    );

  }

}


/* =========================================================
   人物一覧表示
========================================================= */

function renderPeople() {

  const list =
    document.getElementById(
      "personList"
    );


  list.innerHTML = "";


  people.forEach(
    person => {

      const personDiv =
        document.createElement(
          "div"
        );


      personDiv.className =
        "person";


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "person-header";


      const title =
        document.createElement(
          "h3"
        );


      const pendingCount =
        (
          pendingImages[
            person.id
          ] ||
          []
        ).length;


      title.textContent =
        `${person.name}（画像 ${
          person.images.length +
          pendingCount
        }枚）`;


      header.appendChild(
        title
      );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.type =
        "button";


      deleteButton.textContent =
        "人物を削除";


      deleteButton.className =
        "delete-button";


      deleteButton.addEventListener(
        "click",
        () =>
          deletePerson(
            person
          )
      );


      header.appendChild(
        deleteButton
      );

/* =========================================================
   複数画像追加
========================================================= */

async function addPendingImages(
  person,
  files
) {

  if (
    !pendingImages[
      person.id
    ]
  ) {

    pendingImages[
      person.id
    ] = [];

  }


  for (
    const file of files
  ) {

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      continue;

    }


    try {

      const dataUrl =
        await fileToDataURL(
          file
        );


      pendingImages[
        person.id
      ].push({

        id:
          createId(),

        file:
          file,

        dataUrl:
          dataUrl,

        previewUrl:
          dataUrl

      });

    }

    catch(error) {

      console.error(error);

      alert(
        `${file.name} の読み込みに失敗しました。`
      );

    }

  }


  renderPeople();

}


/* =========================================================
   ID生成
========================================================= */

function createId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID ===
      "function"
  ) {

    return window.crypto.randomUUID();

  }


  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2)
  );

}


/* =========================================================
   保留画像削除
========================================================= */

function deletePendingImage(
  person,
  pendingImage
) {

  if (
    !confirm(
      "この画像を削除しますか？"
    )
  ) {

    return;

  }


  pendingImages[
    person.id
  ] =
    (
      pendingImages[
        person.id
      ] ||
      []
    ).filter(
      image =>
        image.id !==
        pendingImage.id
    );


  renderPeople();

}

function updateCounts() {

  const savedCount =
    people.reduce(
      (

        person.images.length,
      0
    );


  const pendingCount =
    Object.values(
      pendingImages
    ).reduce(
      (

        images
      ) =>
        total +

      0
    );


  document
    .getElementById(

/* =========================================================
   File → DataURL
========================================================= */

function fileToDataURL(file) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        () =>
          reject(
            reader.error ||
            new Error(
              "ファイルを読み込めませんでした"
            )
          );


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   DataURL → Image
========================================================= */

function loadImageFromDataURL(
  dataUrl
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();


      img.onload =
        () =>
          resolve(
            img
          );


      img.onerror =
        () =>
          reject(
            new Error(
              "画像を読み込めませんでした"
            )
          );


      img.src =
        dataUrl;

    }
  );

}

      squareSize:
        0

  catch(error) {

    console.error(error);

    alert(
      "画像の読み込みに失敗しました。\n\n" +

    );

  }

}

/* =========================================================
   切り抜きエリア初期化
========================================================= */

function setupCropArea() {

  const area =
    document.getElementById(
      "cropArea"
    );


  const image =
    cropState.sourceImage;


  if (!image) {
    return;
  }


  const naturalWidth =
    image.naturalWidth;

  const naturalHeight =
    image.naturalHeight;


  const areaWidth =
    area.clientWidth;

  const areaHeight =
    area.clientHeight;


  if (
    naturalWidth <= 0 ||
    naturalHeight <= 0 ||
    areaWidth <= 0 ||
    areaHeight <= 0
  ) {

    return;

  }


  /*
    画像をエリア内に収める。
  */

  const fitScale =
    Math.min(
      areaWidth /
        naturalWidth,

      areaHeight /
        naturalHeight
    );


  const fittedWidth =
    naturalWidth *
    fitScale;

  const fittedHeight =
    naturalHeight *
    fitScale;


  /*
    白枠は画像短辺の90%。
  */

  cropState.squareSize =
    Math.min(
      fittedWidth,
      fittedHeight
    ) * 0.9;


  cropState.squareSize =
    Math.min(
      cropState.squareSize,
      areaWidth * 0.92,
      areaHeight * 0.92
    );


  /*
    最低ズームでも白枠全体を画像が覆うようにする。
  */

  const minScale =
    Math.max(
      cropState.squareSize /
        naturalWidth,

      cropState.squareSize /
        naturalHeight
    );


  cropState.baseScale =
    minScale;


  cropState.zoom =
    1;


  cropState.squareLeft =
    (
      areaWidth -
      cropState.squareSize
    ) / 2;


  cropState.squareTop =
    (
      areaHeight -
      cropState.squareSize
    ) / 2;


  const imageWidth =
    naturalWidth *
    cropState.baseScale;

  const imageHeight =
    naturalHeight *
    cropState.baseScale;


  cropState.imageLeft =
    cropState.squareLeft +
    (
      cropState.squareSize -
      imageWidth
    ) / 2;


  cropState.imageTop =
    cropState.squareTop +
    (
      cropState.squareSize -
      imageHeight
    ) / 2;


  updateCropDisplay();

}


/* =========================================================
   切り抜き表示更新
========================================================= */

function updateCropDisplay() {

  const imageElement =
    document.getElementById(
      "cropImage"
    );


  const square =
    document.getElementById(
      "cropSquare"
    );


  if (
    !cropState.sourceImage ||
    cropState.squareSize <= 0
  ) {

    return;

  }


  const naturalWidth =
    cropState.sourceImage.naturalWidth;

  const naturalHeight =
    cropState.sourceImage.naturalHeight;


  const scale =
    cropState.baseScale *
    cropState.zoom;


  const imageWidth =
    naturalWidth *
    scale;

  const imageHeight =
    naturalHeight *
    scale;


  /*
    白枠内に画像がない部分を作らない。
  */

  const minLeft =
    cropState.squareLeft +
    cropState.squareSize -
    imageWidth;

  const maxLeft =
    cropState.squareLeft;


  const minTop =
    cropState.squareTop +
    cropState.squareSize -
    imageHeight;

  const maxTop =
    cropState.squareTop;


  cropState.imageLeft =
    Math.max(
      minLeft,
      Math.min(
        maxLeft,
        cropState.imageLeft
      )
    );


  cropState.imageTop =
    Math.max(
      minTop,
      Math.min(
        maxTop,
        cropState.imageTop
      )
    );


  imageElement.style.width =
    imageWidth + "px";


  imageElement.style.height =
    imageHeight + "px";


  imageElement.style.left =
    cropState.imageLeft + "px";


  imageElement.style.top =
    cropState.imageTop + "px";


  square.style.width =
    cropState.squareSize + "px";


  square.style.height =
    cropState.squareSize + "px";


  square.style.left =
    cropState.squareLeft + "px";


  square.style.top =
    cropState.squareTop + "px";

}


/* =========================================================
   ドラッグ開始
========================================================= */

function startImageDrag(event) {

  if (
    !cropState.sourceImage
  ) {

    return;

  }


  imageDragging =
    true;


  dragStartX =
    event.clientX;


  dragStartY =
    event.clientY;


  dragStartImageLeft =
    cropState.imageLeft;


  dragStartImageTop =
    cropState.imageTop;


  const area =
    document.getElementById(
      "cropArea"
    );


  try {

    area.setPointerCapture(
      event.pointerId
    );

  }

  catch(error) {
    console.warn(error);
  }


  document
    .getElementById(
      "cropImage"
    )
    .classList.add(
      "dragging"
    );


  event.preventDefault();

}


/* =========================================================
   ドラッグ中
========================================================= */

function moveImageDrag(event) {

  if (!imageDragging) {
    return;
  }


  const dx =
    event.clientX -
    dragStartX;


  const dy =
    event.clientY -
    dragStartY;


  cropState.imageLeft =
    dragStartImageLeft +
    dx;


  cropState.imageTop =
    dragStartImageTop +
    dy;


  updateCropDisplay();


  event.preventDefault();

}


/* =========================================================
   ドラッグ終了
========================================================= */

function stopImageDrag() {

  imageDragging =
    false;


  document
    .getElementById(
      "cropImage"
    )
    .classList.remove(
      "dragging"
    );

}


/* =========================================================
   ズーム
========================================================= */

function updateZoom(value) {

  if (
    !cropState.sourceImage
  ) {

    return;

  }


  const oldZoom =
    cropState.zoom;


  const newZoom =
    parseFloat(
      value
    );


  if (
    !Number.isFinite(
      newZoom
    )
  ) {

    return;

  }


  const centerX =
    cropState.squareLeft +
    cropState.squareSize / 2;


  const centerY =
    cropState.squareTop +
    cropState.squareSize / 2;


  const oldWidth =
    cropState.sourceImage.naturalWidth *
    cropState.baseScale *
    oldZoom;


  const oldHeight =
    cropState.sourceImage.naturalHeight *
    cropState.baseScale *
    oldZoom;


  /*
    ズーム前に白枠中央が
    画像のどこにあったか。
  */

  const relativeX =
    (
      centerX -
      cropState.imageLeft
    ) /
    oldWidth;


  const relativeY =
    (
      centerY -
      cropState.imageTop
    ) /
    oldHeight;


  cropState.zoom =
    newZoom;


  const newWidth =
    cropState.sourceImage.naturalWidth *
    cropState.baseScale *
    newZoom;


  const newHeight =
    cropState.sourceImage.naturalHeight *
    cropState.baseScale *
    newZoom;


  cropState.imageLeft =
    centerX -
    relativeX *
    newWidth;


  cropState.imageTop =
    centerY -
    relativeY *
    newHeight;


  updateCropDisplay();


  document
    .getElementById(
      "zoomText"
    )
    .textContent =
    Math.round(
      newZoom * 100
    ) +
    "%";

}


/* =========================================================
   切り抜きキャンセル
========================================================= */

function closeCropModal() {

  imageDragging =
    false;


  document
    .getElementById(
      "cropModal"
    )
    .style.display =
    "none";

    zoom: 1,

    imageLeft: 0,

    imageTop: 0,

    squareLeft: 0,

    squareTop: 0,

    squareSize: 0

  };

}


/* =========================================================
   切り抜きBlob作成
========================================================= */

async function createCroppedBlob() {

  const image =
    cropState.sourceImage;


  if (!image) {

    throw new Error(
      "元画像がありません。"
    );

  }


  const displayScale =
    cropState.baseScale *
    cropState.zoom;


  let sx =
    (
      cropState.squareLeft -
      cropState.imageLeft
    ) /
    displayScale;


  let sy =
    (
      cropState.squareTop -
      cropState.imageTop
    ) /
    displayScale;


  let size =
    cropState.squareSize /
    displayScale;


  /*
    範囲補正
  */

  sx =
    Math.max(
      0,
      Math.min(
        image.naturalWidth -
          size,
        sx
      )
    );


  sy =
    Math.max(
      0,
      Math.min(
        image.naturalHeight -
          size,
        sy
      )
    );


  size =
    Math.min(
      size,
      image.naturalWidth -
        sx,
      image.naturalHeight -
        sy
    );


  if (
    size <= 0
  ) {

    throw new Error(
      "切り抜き範囲が不正です。"
    );

  }


  /*
    高画質500×500
  */

  const outputSize =
    500;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    outputSize;

  canvas.height =
    outputSize;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    image,

    sx,
    sy,
    size,
    size,

    0,
    0,
    outputSize,
    outputSize

  );


  return new Promise(
    (
      resolve,
      reject
    ) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                "画像の生成に失敗しました。"
              )
            );

            return;

          }


          resolve(
            blob
          );

        },

        "image/jpeg",

        0.85

      );

    }
  );

}


/* =========================================================
   Storage画像保存
========================================================= */

async function uploadCroppedImage(
  personId,
  blob
) {

  const fileName =
    `${personId}/` +
    `${Date.now()}-` +
    `${Math.random()
      .toString(36)
      .substring(2)}` +
    `.jpg`;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from("images")
    .upload(
      fileName,
      blob,
      {

        contentType:
          "image/jpeg",

        upsert:
          false

      }
    );


  if (error) {

    throw error;

  }


  return fileName;

}

/* =========================================================
   切り抜き保存
========================================================= */
async function saveCrop() {

  const saveButton =
    document.getElementById(
      "cropSaveButton"
    );


  if (
    !saveButton ||
    saveButton.disabled
  ) {

    return;

  }


  saveButton.disabled =
    true;

  saveButton.textContent =
    "保存中...";


  let uploadedPath =
    null;


  try {

    const blob =
      await createCroppedBlob();


    /* =====================================================
       新規・保留画像
    ===================================================== */

    if (
      cropState.mode === "pending" ||
      cropState.mode === "new"
    ) {

      const person =
        cropState.person;


      if (!person) {

        throw new Error(
          "人物情報がありません。"
        );

      }


      /*
        ① 切り抜き画像をStorageへ保存
      */

      uploadedPath =
        await uploadCroppedImage(
          person.id,
          blob
        );


      /*
        ② DBへ登録
      */

      const {
        error: dbError
      } =
      await supabaseClient
        .from("person_images")
        .insert({

          person_id:
            person.id,

          image_path:
            uploadedPath

        });


      /*
        DB登録失敗
        → アップロードした画像を削除
      */

      if (dbError) {

        await supabaseClient
          .storage
          .from("images")
          .remove([
            uploadedPath
          ]);


        uploadedPath =
          null;


        throw dbError;

      }


      /*
        ③ 保留画像を削除
      */

      if (
        cropState.image
      ) {

        pendingImages[
          person.id
        ] =
          (
            pendingImages[
              person.id
            ] ||
            []
          ).filter(
            item =>
              item.id !==
              cropState.image.id
          );

      }

    }

    else {

      throw new Error(
        "切り抜きモードが不正です。"
      );

    }


    /*
      保存完了
    */

    closeCropModal();


    /*
      最新状態を再読み込み
    */

    await loadPeople();


    alert(
      "切り抜き画像を保存しました。"
    );

  }


  catch(error) {

    console.error(
      "切り抜き保存エラー:",
      error
    );


    alert(
      "画像の保存に失敗しました。\n\n" +
      error.message
    );

  }


  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      "✂️ この範囲で保存";

  }

}

/* =========================================================
   画像削除
========================================================= */

async function deleteImage(
  image
) {

  if (
    !confirm(
      "この画像を削除しますか？"
    )
  ) {

    return;

  }


  try {

    if (
      image.path
    ) {

      const {
        error:
          storageError
      } =
      await supabaseClient
        .storage
        .from("images")
        .remove([
          image.path
        ]);


      if (storageError) {

        throw storageError;

      }

    }


    const {
      error:
        dbError
    } =
    await supabaseClient
      .from("person_images")
      .delete()
      .eq(
        "id",
        image.id
      );


    if (dbError) {

      throw dbError;

    }


    await loadPeople();

  }

  catch(error) {

    console.error(error);

    alert(
      "画像の削除に失敗しました。\n\n" +
      error.message
    );

  }

}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(array) {

  for (
    let i =
      array.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================================================
   ゲーム開始
========================================================= */

function startGame() {

  /*
    未切り抜き画像確認
  */

  const pendingCount =
    Object.values(
      pendingImages
    ).reduce(
      (
        total,
        images
      ) =>
        total +
        images.length,
      0
    );


  if (
    pendingCount > 0
  ) {

    alert(
      "まだ切り抜いていない画像があります。\n\n" +
      "画像の「✂️ 切り抜き」を完了してください。"
    );

    return;

  }


  /*
    2枚以上ある人物だけゲームに参加。
  */

  const usablePeople =
    people.filter(
      person =>
        person.images.length >= 2
    );


  if (
    usablePeople.length === 0
  ) {

    alert(
      "最低1人、画像を2枚以上登録してください。"
    );

    return;

  }


  let cards = [];


  usablePeople.forEach(
    person => {

      const images =
        shuffle(
          [...person.images]
        );


      const selected =
        images.slice(
          0,
          2
        );


      selected.forEach(
        image => {

          cards.push({

            person:
              String(
                person.id
              ),

            personName:
              person.name,

            image:
              image.url

          });

        }
      );

    }
  );


  shuffle(cards);


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "game"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";


  const board =
    document.getElementById(
      "board"
    );


  board.innerHTML =
    "";


  selectedCards = [];

  lock = false;

  moves = 0;

  remainingPairs =
    usablePeople.length;


  updateStatus();


  cards.forEach(
    card => {

      const cardElement =
        document.createElement(
          "div"
        );


      cardElement.className =
        "card";


      cardElement.dataset.person =
        card.person;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        card.image;


      img.alt =
        "カード";


      img.className =
        "hidden-image";


      cardElement.appendChild(
        img
      );


      cardElement.addEventListener(
        "click",
        () =>
          flipCard(
            cardElement
          )
      );


      board.appendChild(
        cardElement
      );

    }
  );

}


/* =========================================================
   ステータス
========================================================= */

function updateStatus() {

  document
    .getElementById(
      "remainingDisplay"
    )
    .textContent =
    remainingPairs;


  document
    .getElementById(
      "movesDisplay"
    )
    .textContent =
    moves;

}


/* =========================================================
   カードをめくる
========================================================= */

function flipCard(card) {

  if (lock) {
    return;
  }


  if (
    card.classList.contains(
      "completed"
    )
  ) {

    return;

  }


  if (
    selectedCards.includes(
      card
    )
  ) {

    return;

  }


  const img =
    card.querySelector(
      "img"
    );


  img.classList.remove(
    "hidden-image"
  );


  card.classList.add(
    "revealed"
  );


  selectedCards.push(
    card
  );


  if (
    selectedCards.length ===
    2
  ) {

    moves++;

    updateStatus();

    lock =
      true;


    setTimeout(
      checkPair,
      800
    );

  }

}


/* =========================================================
   ペア判定
========================================================= */

function checkPair() {

  const card1 =
    selectedCards[0];

  const card2 =
    selectedCards[1];


  if (
    !card1 ||
    !card2
  ) {

    selectedCards = [];

    lock =
      false;

    return;

  }


  const person1 =
    card1.dataset.person;

  const person2 =
    card2.dataset.person;


  if (
    person1 ===
    person2
  ) {

    card1.classList.add(
      "completed"
    );


    card2.classList.add(
      "completed"
    );


    remainingPairs--;

    updateStatus();


    if (
      remainingPairs ===
      0
    ) {

      document
        .getElementById(
          "message"
        )
        .innerHTML = `

          <div class="clear-box">

            <h2>
              🎉 GAME CLEAR！
            </h2>

            <p>
              ${moves}回でクリアしました！
            </p>

            <button
              id="playAgainButton"
              type="button"
            >
              もう一度遊ぶ
            </button>

            <button
              id="clearBackButton"
              type="button"
            >
              編集画面へ
            </button>

          </div>

        `;


      document
        .getElementById(
          "playAgainButton"
        )
        .addEventListener(
          "click",
          startGame
        );


      document
        .getElementById(
          "clearBackButton"
        )
        .addEventListener(
          "click",
          backToEditor
        );

    }

  }

  else {

    card1
      .querySelector(
        "img"
      )
      .classList.add(
        "hidden-image"
      );


    card2
      .querySelector(
        "img"
      )
      .classList.add(
        "hidden-image"
      );


    card1.classList.remove(
      "revealed"
    );


    card2.classList.remove(
      "revealed"
    );

  }


  selectedCards = [];

  lock =
    false;

}


/* =========================================================
   編集画面に戻る
========================================================= */

function backToEditor() {

  document
    .getElementById(
      "game"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";


  selectedCards = [];

  lock =
    false;

}

   イベント登録
========================================================= */


document
  .getElementById(
    "addPersonButton"
  )
  .addEventListener(

  );


document
  .getElementById(

document

  )

  .getElementById(

  .getElementById(

/* =========================================================
   Enterキー
========================================================= */

document
  .getElementById(
    "personName"
  )
  .addEventListener(
    "keydown",

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        addPerson();

      }

    }
  );


/* =========================================================
   ドラッグイベント
========================================================= */

const cropAreaElement =
  document.getElementById(
    "cropArea"
  );


cropAreaElement.addEventListener(
  "pointerdown",
  startImageDrag
);


cropAreaElement.addEventListener(
  "pointermove",
  moveImageDrag
);


cropAreaElement.addEventListener(
  "pointerup",
  stopImageDrag
);


cropAreaElement.addEventListener(
  "pointercancel",
  stopImageDrag
);


/* =========================================================
   ウィンドウサイズ変更
========================================================= */

window.addEventListener(
  "resize",
  function() {

    const modal =
      document.getElementById(
        "cropModal"
      );


    if (
      modal.style.display ===
      "flex" &&
      cropState.sourceImage
    ) {

      /*
        白枠そのものは維持し、
        現在位置が範囲外になった場合だけ補正。
      */

      const area =
        document.getElementById(
          "cropArea"
        );


      const newWidth =
        area.clientWidth;


      const newHeight =
        area.clientHeight;


      if (
        newWidth <= 0 ||
        newHeight <= 0
      ) {

        return;

      }


      /*
        モーダルのサイズ変更時は
        白枠を中央へ再配置。
      */

      cropState.squareLeft =
        (
          newWidth -
          cropState.squareSize
        ) / 2;


      cropState.squareTop =
        (
          newHeight -
          cropState.squareSize
        ) / 2;


      updateCropDisplay();

    }

  }
);

</script>

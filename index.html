<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>人物でそろえる神経衰弱 TEST123</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        "Noto Sans JP",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8f9ff
        );

      color: #222;
      min-height: 100vh;
    }


    /* =========================
       ヘッダー
    ========================= */

    header {
      text-align: center;
      padding: 30px 20px 25px;

      background:
        linear-gradient(
          135deg,
          #4169e1,
          #7b68ee
        );

      color: white;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }


    /* =========================
       全体コンテナ
    ========================= */

    .container {
      width: min(95%, 1000px);
      margin: 25px auto 50px;
    }


    /* =========================
       パネル
    ========================= */

    .panel {
      background: white;

      padding: 24px;

      border-radius: 20px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.08);

      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }


    /* =========================
       統計
    ========================= */

    .stats,
    .game-stats {
      display: flex;
      justify-content: center;
      gap: 15px;

      flex-wrap: wrap;

      margin: 20px auto;

      padding: 0 15px;
    }

    .stat-box,
    .stat-card {
      background: white;

      min-width: 130px;

      padding: 15px 20px;

      border-radius: 16px;

      text-align: center;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.08);

      transition: transform .2s;
    }

    .stat-box:hover,
    .stat-card:hover {
      transform: translateY(-3px);
    }

    .stat-box span,
    .stat-card span {
      display: block;

      font-size: 28px;
      font-weight: bold;

      color: #4169e1;
    }

    small {
      color: #666;
    }


    /* =========================
       入力欄
    ========================= */

    input[type="text"] {
      width: min(300px, 100%);

      padding: 12px 14px;

      font-size: 16px;

      border: 2px solid #ddd;

      border-radius: 10px;

      outline: none;

      transition: border .2s;
    }

    input[type="text"]:focus {
      border-color: #4169e1;
    }

    input[type="file"] {
      margin-top: 10px;
      max-width: 100%;
    }


    /* =========================
       ボタン
    ========================= */

    button {
      padding: 11px 18px;

      margin: 5px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #4169e1,
          #6a5acd
        );

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform .2s,
        opacity .2s,
        box-shadow .2s;

      box-shadow:
        0 4px 10px
        rgba(65,105,225,.25);
    }

    button:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    button:active {
      transform: scale(.97);
    }


    /* =========================
       人物カード
    ========================= */

    .person {
      background: #fff;

      border: 1px solid #eee;

      border-radius: 18px;

      padding: 18px;

      margin-top: 18px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.07);
    }

    .person-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .person-header h3 {
      margin: 0;
    }


    /* =========================
       画像一覧
    ========================= */

    .image-list {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 15px;
    }

    .image-box {
      position: relative;

      width: 110px;
      height: 110px;
    }

    .image-box img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 12px;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,.15);
    }

    .delete-image {
      position: absolute;

      top: -8px;
      right: -8px;

      width: 30px;
      height: 30px;

      padding: 0;
      margin: 0;

      border-radius: 50%;

      background: #e53935;

      display: flex;

      justify-content: center;
      align-items: center;

      font-size: 18px;

      box-shadow:
        0 3px 8px
        rgba(0,0,0,.2);
    }


    /* =========================
       ゲーム盤面
    ========================= */

    .card-board {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(100px, 1fr)
        );

      gap: 12px;

      margin-top: 20px;
    }

    .card {
      position: relative;

      aspect-ratio: 1 / 1;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #4169e1,
          #7b68ee
        );

      cursor: pointer;

      overflow: hidden;

      box-shadow:
        0 5px 15px
        rgba(0,0,0,.15);

      transition:
        transform .25s,
        box-shadow .25s;
    }

    .card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 8px 20px
        rgba(0,0,0,.2);
    }


    /* カード裏面 */

    .card::before {
      content: "🃏";

      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      color: white;

      font-size: clamp(28px, 6vw, 45px);

      z-index: 2;
    }

    .card.revealed::before {
      display: none;
    }


    /* カード画像 */

    .card img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .hidden-image {
      display: none !important;
    }


    /* 揃ったカード */

    .completed {
      opacity: .45;

      pointer-events: none;

      transform: scale(.96);
    }


    /* =========================
       クリア画面
    ========================= */

    #message {
      text-align: center;

      font-size: 20px;

      margin-top: 25px;
    }

    .clear-box {
      background:
        linear-gradient(
          135deg,
          #fff,
          #f3f1ff
        );

      padding: 25px;

      border-radius: 20px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.1);

      animation: popup .4s ease;
    }

    @keyframes popup {

      from {
        opacity: 0;
        transform: scale(.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================
       スマホ
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 22px 15px;
      }

      h1 {
        font-size: 22px;
      }

      .panel {
        padding: 16px;
      }

      .card-board {
        grid-template-columns:
          repeat(3, 1fr);

        gap: 8px;
      }

      .card {
        border-radius: 12px;
      }

      .image-box {
        width: 90px;
        height: 90px;
      }

      .person-header {
        flex-direction: column;

        align-items: flex-start;
      }

      .stats,
      .game-stats {
        gap: 10px;
      }

      .stat-box,
      .stat-card {
        min-width: 110px;
      }

    }

  </style>
</head>


<body>

<header>

  <h1>
    人物でそろえる神経衰弱テスト2
  </h1>

  <p>
    画像が違っても同じ人物ならペア！
  </p>

</header>


<!-- 統計 -->

<div class="stats">

  <div class="stat-box">

    <span id="personCount">
      0
    </span>

    <small>
      人物数
    </small>

  </div>


  <div class="stat-box">

    <span id="imageCount">
      0
    </span>

    <small>
      画像数
    </small>

  </div>

</div>


<div class="container">


  <!-- 編集画面 -->

  <div
    id="editor"
    class="panel"
  >

    <h2>
      人物を追加
    </h2>


    <input
      type="text"

    >


    <button onclick="addPerson()">

      人物を追加

    </button>

    <br>

  >

    </h2>


    <div class="game-stats">

      <div class="stat-card">

        <span id="remainingDisplay">
          0
        </span>

        <small>
          残り組数
        </small>

      </div>


      <div class="stat-card">

        <span id="movesDisplay">
          0
        </span>

        <small>
          挑戦回数
        </small>

      </div>

    </div>


    <div
      id="board"
      class="card-board"
    ></div>


    <div id="message"></div>

  </div>


</div>

<script>
alert("JavaScript起動！");
/* =========================
   Supabase設定
========================= */

const SUPABASE_URL =
  "https://zuwhkhsviqfitfzpgcdy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_E09QP-l02lAr14I3p04wHg_2-1nE1TM";


const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   データ
========================= */

let people = [];

let selectedCards = [];

let lock = false;

let remainingPairs = 0;

let moves = 0;


/* =========================
   画像圧縮
========================= */

async function compressImage(file) {

  return new Promise((resolve) => {

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        const img =
          new Image();

        img.onload =
          function() {

            const canvas =
              document.createElement("canvas");

            const maxWidth = 800;

            let width =
              img.width;

            let height =
              img.height;


            if (
              width > maxWidth
            ) {

              height =
                height *
                maxWidth /
                width;

              width =
                maxWidth;

            }


            canvas.width =
              width;

            canvas.height =
              height;


            const ctx =
              canvas.getContext("2d");


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            canvas.toBlob(
              function(blob) {

                resolve(blob);

              },
              "image/jpeg",
              0.7
            );

          };


        img.src =
          event.target.result;

      };


    reader.readAsDataURL(file);

  });

}


/* =========================
   人物・画像数更新
========================= */

function updateCounts() {

  const personCount =
    people.length;


  const imageCount =
    people.reduce(
      (
        total,
        person
      ) => {

        return (
          total +
          person.images.length
        );

      },
      0
    );


  document
    .getElementById(
      "personCount"
    )
    .textContent =
    personCount;


  document
    .getElementById(
      "imageCount"
    )
    .textContent =
    imageCount;

}


/* =========================
   人物読み込み
========================= */

async function loadPeople() {

  const {
    data: peopleData,
    error: peopleError
  } =
    await supabase
      .from("people")
      .select("*")
      .order(
        "id",
        {
          ascending: true
        }
      );


  if (peopleError) {

    console.error(
      peopleError
    );

    alert(
      "人物データの読み込みに失敗しました"
    );

    return;

  }


  /* 画像も取得 */

  const {
    data: imageData,
    error: imageError
  } =
    await supabase
      .from("person_images")
      .select("*");


  if (imageError) {

    console.error(
      imageError
    );

    alert(
      "画像データの読み込みに失敗しました"
    );

    return;

  }


  people =
    peopleData.map(
      person => {

        const images =
          imageData
            .filter(
              image =>
                image.person_id ===
                person.id
            )
            .map(
              image => {

                const {
                  data
                } =
                  supabase
                    .storage
                    .from("images")
                    .getPublicUrl(
                      image.image_path
                    );


                return {

                  id:
                    image.id,

                  path:
                    image.image_path,

                  url:
                    data.publicUrl

                };

              }
            );


        return {

          ...person,

          images:
            images

        };

      }
    );


  renderPeople();

}


/* =========================
   人物追加
========================= */

async function addPerson() {

  const nameInput =
    document.getElementById(
      "personName"
    );


  const name =
    nameInput.value.trim();


  if (
    name === ""
  ) {

    alert(
      "人物名を入力してください"
    );

    return;

  }


  const { error } =
    await supabase
      .from("people")
      .insert({
        name: name
      });


  if (error) {

    alert(
      error.message
    );

    return;

  }


  nameInput.value =
    "";


  await loadPeople();

}


/* =========================
   人物削除
========================= */

async function deletePerson(
  person
) {

  const ok =
    confirm(
      `「${person.name}」と画像を削除しますか？`
    );


  if (!ok) return;


  /* Storageの画像を削除 */

  const imagePaths =
    person.images.map(
      image =>
        image.path
    );


  if (
    imagePaths.length > 0
  ) {

    const {
      error: storageError
    } =
      await supabase
        .storage
        .from("images")
        .remove(
          imagePaths
        );


    if (storageError) {

      console.error(
        storageError
      );

    }

  }


  /* Databaseから人物削除 */

  const { error } =
    await supabase
      .from("people")
      .delete()
      .eq(
        "id",
        person.id
      );


  if (error) {

    alert(
      error.message
    );

    return;

  }


  await loadPeople();

}


/* =========================
   画像アップロード
========================= */

async function uploadImages(
  person,
  files
) {

  for (
    const file
    of files
  ) {

    try {

      /*
      画像圧縮
      */

      const compressedBlob =
        await compressImage(
          file
        );


      /*
      ファイル名作成
      */

      const fileName =
        `${person.id}/${Date.now()}-${Math.random()
          .toString(36)
          .substring(2)}.jpg`;


      /*
      Storageに保存
      */

      const {
        error: uploadError
      } =
        await supabase
          .storage
          .from("images")
          .upload(
            fileName,
            compressedBlob,
            {
              contentType:
                "image/jpeg"
            }
          );


      if (uploadError) {

        console.error(
          uploadError
        );

        alert(
          "画像のアップロードに失敗しました"
        );

        continue;

      }


      /*
      Databaseに画像情報を保存
      */

      const {
        error: dbError
      } =
        await supabase
          .from("person_images")
          .insert({

            person_id:
              person.id,

            image_path:
              fileName

          });


      if (dbError) {

        console.error(
          dbError
        );

        alert(
          "画像情報の保存に失敗しました"
        );

      }

    }

    catch (
      error
    ) {

      console.error(
        error
      );

      alert(
        "画像処理中にエラーが発生しました"
      );

    }

  }


  await loadPeople();

}


/* =========================
   画像削除
========================= */

async function deleteImage(
  image
) {

  const ok =
    confirm(
      "この画像を削除しますか？"
    );


  if (!ok) return;


  /*
  Storageから削除
  */

  const {
    error: storageError
  } =
    await supabase
      .storage
      .from("images")
      .remove([
        image.path
      ]);


  if (storageError) {

    alert(
      "Storageから画像を削除できませんでした"
    );

    return;

  }


  /*
  Databaseから削除
  */

  const {
    error: dbError
  } =
    await supabase
      .from("person_images")
      .delete()
      .eq(
        "id",
        image.id
      );


  if (dbError) {

    alert(
      "画像情報を削除できませんでした"
    );

    return;

  }


  await loadPeople();

}


/* =========================
   人物一覧表示
========================= */

function renderPeople() {

  const list =
    document.getElementById(
      "personList"
    );


  list.innerHTML =
    "";


  people.forEach(
    person => {


      const personDiv =
        document.createElement(
          "div"
        );


      personDiv.className =
        "person";


      /* ヘッダー */

      const header =
        document.createElement(
          "div"
        );


      header.className =
        "person-header";


      const title =
        document.createElement(
          "h3"
        );


      title.textContent =
        `${person.name}（画像 ${person.images.length}枚）`;


      header.appendChild(
        title
      );


      /* 人物削除 */

      const deletePersonButton =
        document.createElement(
          "button"
        );


      deletePersonButton.textContent =
        "人物を削除";


      deletePersonButton.onclick =
        function() {

          deletePerson(
            person
          );

        };


      header.appendChild(
        deletePersonButton
      );


      personDiv.appendChild(
        header
      );


      /* 画像追加 */

      const fileInput =
        document.createElement(
          "input"
        );


      fileInput.type =
        "file";


      fileInput.accept =
        "image/*";


      fileInput.multiple =
        true;


      fileInput.onchange =
        async function(event) {

          const files =
            Array.from(
              event.target.files
            );


          if (
            files.length === 0
          ) return;


          fileInput.disabled =
            true;


          await uploadImages(
            person,
            files
          );

        };


      personDiv.appendChild(
        fileInput
      );


      /* 画像一覧 */

      const imageList =
        document.createElement(
          "div"
        );


      imageList.className =
        "image-list";


      person.images.forEach(
        image => {


          const imageBox =
            document.createElement(
              "div"
            );


          imageBox.className =
            "image-box";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            image.url;


          imageBox.appendChild(
            img
          );


          /* 画像削除 */

          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.textContent =
            "×";


          deleteButton.className =
            "delete-image";


          deleteButton.onclick =
            function() {

              deleteImage(
                image
              );

            };


          imageBox.appendChild(
            deleteButton
          );


          imageList.appendChild(
            imageBox
          );

        }
      );


      personDiv.appendChild(
        imageList
      );


      list.appendChild(
        personDiv
      );

    }
  );


  updateCounts();

}


/* =========================
   シャッフル
========================= */

function shuffle(array) {

  for (
    let i =
      array.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ]
      =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================
   ゲーム開始
========================= */

function startGame() {

  const usablePeople =
    people.filter(
      person =>
        person.images.length >= 2
    );


  if (
    usablePeople.length === 0
  ) {

    alert(
      "最低1人、画像を2枚以上追加してください"
    );

    return;

  }


  let cards = [];


  usablePeople.forEach(
    person => {


      const shuffledImages =
        shuffle(
          [...person.images]
        );


      const selectedImages =
        shuffledImages.slice(
          0,
          2
        );


      selectedImages.forEach(
        image => {

          cards.push({

            person:
              person.name,

            image:
              image.url

          });

        }
      );

    }
  );


  cards =
    shuffle(cards);


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "game"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";


  const board =
    document.getElementById(
      "board"
    );


  board.innerHTML =
    "";


  selectedCards =
    [];


  lock =
    false;


  moves =
    0;


  remainingPairs =
    usablePeople.length;


  updateStatus();


  cards.forEach(
    card => {


      const cardElement =
        document.createElement(
          "div"
        );


      cardElement.className =
        "card";


      cardElement.dataset.person =
        card.person;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        card.image;


      img.className =
        "hidden-image";


      cardElement.appendChild(
        img
      );


      cardElement.onclick =
        function() {

          flipCard(
            cardElement
          );

        };


      board.appendChild(
        cardElement
      );

    }
  );

}


/* =========================
   ステータス更新
========================= */

function updateStatus() {

  document
    .getElementById(
      "remainingDisplay"
    )
    .textContent =
    remainingPairs;


  document
    .getElementById(
      "movesDisplay"
    )
    .textContent =
    moves;

}


/* =========================
   カードをめくる
========================= */

function flipCard(card) {

  if (lock) return;

  if (
    card.classList.contains(
      "completed"
    )
  ) return;

  if (
    selectedCards.includes(
      card
    )
  ) return;


  const img =
    card.querySelector(
      "img"
    );


  img.classList.remove(
    "hidden-image"
  );


  card.classList.add(
    "revealed"
  );


  selectedCards.push(
    card
  );


  if (
    selectedCards.length === 2
  ) {

    moves++;

    updateStatus();

    lock = true;

    setTimeout(
      checkPair,
      800
    );

  }

}


/* =========================
   ペア判定
========================= */

function checkPair() {

  const card1 =
    selectedCards[0];

  const card2 =
    selectedCards[1];


  const person1 =
    card1.dataset.person;

  const person2 =
    card2.dataset.person;


  if (
    person1 === person2
  ) {

    card1.classList.add(
      "completed"
    );

    card2.classList.add(
      "completed"
    );

    remainingPairs--;

    updateStatus();


    if (
      remainingPairs === 0
    ) {

      document
        .getElementById(
          "message"
        )
        .innerHTML =
        `
        <div class="clear-box">

          <h2>
            🎉 GAME CLEAR！
          </h2>

          <p>
            ${moves}回でクリアしました！
          </p>

          <button
            onclick="startGame()"
          >
            もう一度遊ぶ
          </button>

          <button
            onclick="backToEditor()"
          >
            編集画面へ
          </button>

        </div>
        `;

    }

  }

  else {

    card1
      .querySelector("img")
      .classList.add(
        "hidden-image"
      );

    card2
      .querySelector("img")
      .classList.add(
        "hidden-image"
      );


    card1.classList.remove(
      "revealed"
    );

    card2.classList.remove(
      "revealed"
    );

  }


  selectedCards = [];

  lock = false;

}


/* =========================
   編集画面へ
========================= */

function backToEditor() {

  document
    .getElementById(
      "game"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";

}


/* =========================
   初期化
========================= */

loadPeople();

</script>

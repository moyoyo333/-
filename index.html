<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>人物でそろえる神経衰弱</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    "Noto Sans JP",
    sans-serif;

  background:
    linear-gradient(135deg,#eef2ff,#f8f9ff);

  color: #222;
  min-height: 100vh;
}


/* =========================
   開始画面
========================= */

#startScreen {
  position: fixed;
  inset: 0;

  background:
    linear-gradient(135deg,#4169e1,#7b68ee);

  display: flex;
  justify-content: center;
  align-items: center;

  z-index: 9999;
}

.start-button {
  font-size: 22px;
  padding: 18px 45px;

  border-radius: 15px;

  border: none;

  color: white;

  background: white;
  color: #4169e1;

  font-weight: bold;

  box-shadow:
    0 8px 25px rgba(0,0,0,.2);
}


/* =========================
   ヘッダー
========================= */

header {
  text-align: center;

  padding: 30px 20px 25px;

  background:
    linear-gradient(135deg,#4169e1,#7b68ee);

  color: white;

  box-shadow:
    0 4px 15px rgba(0,0,0,.12);
}

h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

header p {
  margin: 0;
  opacity: .9;
}


/* =========================
   統計
========================= */

.stats,
.game-stats {
  display: flex;

  justify-content: center;

  gap: 15px;

  flex-wrap: wrap;

  margin: 20px auto;

  padding: 0 15px;
}

.stat-box,
.stat-card {
  background: white;

  min-width: 130px;

  padding: 15px 20px;

  border-radius: 16px;

  text-align: center;

  box-shadow:
    0 5px 20px rgba(0,0,0,.08);
}

.stat-box span,
.stat-card span {
  display: block;

  font-size: 28px;

  font-weight: bold;

  color: #4169e1;
}

small {
  color: #666;
}


/* =========================
   コンテナ
========================= */

.container {
  width: min(95%,1000px);

  margin: 25px auto 50px;
}


/* =========================
   パネル
========================= */

.panel {
  background: white;

  padding: 24px;

  border-radius: 20px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.08);

  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
}


/* =========================
   入力
========================= */

input[type="text"] {

  width: min(300px,100%);

  padding: 12px 14px;

  font-size: 16px;

  border: 2px solid #ddd;

  border-radius: 10px;

  outline: none;
}

input[type="text"]:focus {
  border-color: #4169e1;
}

input[type="file"] {
  margin-top: 10px;
  max-width: 100%;
}


/* =========================
   ボタン
========================= */

button {

  padding: 11px 18px;

  margin: 5px;

  border: none;

  border-radius: 10px;

  background:
    linear-gradient(135deg,#4169e1,#6a5acd);

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 4px 10px rgba(65,105,225,.25);
}

button:active {
  transform: scale(.97);
}


/* =========================
   人物
========================= */

.person {

  background: #fff;

  border: 1px solid #eee;

  border-radius: 18px;

  padding: 18px;

  margin-top: 18px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.07);
}

.person-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;
}

.person-header h3 {
  margin: 0;
}


/* =========================
   画像一覧
========================= */

.image-list {

  display: flex;

  flex-wrap: wrap;

  gap: 12px;

  margin-top: 15px;
}

.image-box {

  position: relative;

  width: 110px;
  height: 110px;

  cursor: pointer;
}

.image-box img {

  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 12px;

  box-shadow:
    0 3px 10px rgba(0,0,0,.15);
}

.image-box::after {

  content: "✂️";

  position: absolute;

  bottom: 5px;
  left: 5px;

  background: rgba(0,0,0,.65);

  color: white;

  padding: 3px 6px;

  border-radius: 6px;

  font-size: 12px;
}

.delete-image {

  position: absolute;

  top: -8px;
  right: -8px;

  width: 30px;
  height: 30px;

  padding: 0;
  margin: 0;

  border-radius: 50%;

  background: #e53935;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 18px;

  z-index: 5;
}


/* =========================
   ゲーム
========================= */

.card-board {

  display: grid;

  grid-template-columns:
    repeat(auto-fit,minmax(100px,1fr));

  gap: 12px;

  margin-top: 20px;
}

.card {

  position: relative;

  aspect-ratio: 1 / 1;

  border-radius: 16px;

  background:
    linear-gradient(135deg,#4169e1,#7b68ee);

  cursor: pointer;

  overflow: hidden;

  box-shadow:
    0 5px 15px rgba(0,0,0,.15);
}

.card::before {

  content: "🃏";

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%,-50%);

  color: white;

  font-size: clamp(28px,6vw,45px);

  z-index: 2;
}

.card.revealed::before {
  display: none;
}

.card img {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

.hidden-image {
  display: none !important;
}

.completed {

  opacity: .45;

  pointer-events: none;

  transform: scale(.96);
}


/* =========================
   メッセージ
========================= */

#message {

  text-align: center;

  font-size: 20px;

  margin-top: 25px;
}

.clear-box {

  background:
    linear-gradient(135deg,#fff,#f3f1ff);

  padding: 25px;

  border-radius: 20px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.1);
}


/* =========================
   切り抜きモーダル
========================= */

#cropModal {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.75);

  z-index: 10000;

  justify-content: center;

  align-items: center;

  padding: 15px;
}

.crop-panel {

  width: min(95vw,600px);

  max-height: 95vh;

  overflow: auto;

  background: white;

  border-radius: 20px;

  padding: 20px;

  text-align: center;
}

.crop-panel h2 {
  margin-top: 0;
}


/* 切り抜きエリア */

#cropArea {

  position: relative;

  width: min(90vw,500px);

  height: min(90vw,500px);

  margin: 15px auto;

  overflow: hidden;

  background: #111;

  border-radius: 12px;

  touch-action: none;

  user-select: none;
}

#cropImage {

  position: absolute;

  max-width: none;

  max-height: none;

  user-select: none;

  pointer-events: none;

  transform-origin: top left;
}


/* 正方形ガイド */

.crop-guide {

  position: absolute;

  inset: 0;

  border: 3px solid white;

  pointer-events: none;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,.35);
}


/* =========================
   スマホ
========================= */

@media(max-width:600px) {

  header {
    padding: 22px 15px;
  }

  h1 {
    font-size: 22px;
  }

  .panel {
    padding: 16px;
  }

  .card-board {
    grid-template-columns:
      repeat(3,1fr);

    gap: 8px;
  }

  .image-box {
    width: 90px;
    height: 90px;
  }

  .person-header {
    flex-direction: column;

    align-items: flex-start;
  }

  #cropArea {

    width: 90vw;
    height: 90vw;
  }

}

</style>
</head>


<body>


<!-- =========================
     開始画面
========================= -->

<div id="startScreen">

  <button
    class="start-button"
    onclick="enterSite()"
  >
    🎮 始める
  </button>

</div>


<header>

  <h1>
    人物でそろえる神経衰弱
  </h1>

  <p>
    画像が違っても同じ人物ならペア！
  </p>

</header>


<!-- =========================
     統計
========================= -->

<div class="stats">

  <div class="stat-box">

    <span id="personCount">0</span>

    <small>
      人物数
    </small>

  </div>


  <div class="stat-box">

    <span id="imageCount">0</span>

    <small>
      画像数
    </small>

  </div>

</div>


<div class="container">


<!-- =========================
     編集
========================= -->

<div
  id="editor"
  class="panel"
>

  <h2>
    人物を追加
  </h2>

  <input
    type="text"
    id="personName"
    placeholder="人物名を入力"
  >

  <button onclick="addPerson()">
    人物を追加
  </button>


  <div id="personList"></div>


  <br>


  <button onclick="startGame()">
    🎮 ゲーム開始
  </button>

</div>


<!-- =========================
     ゲーム
========================= -->

<div
  id="game"
  class="panel"
  style="display:none"
>

  <button onclick="backToEditor()">
    ← 編集画面に戻る
  </button>

  <h2>
    神経衰弱
  </h2>


  <div class="game-stats">

    <div class="stat-card">

      <span id="remainingDisplay">
        0
      </span>

      <small>
        残り組数
      </small>

    </div>


    <div class="stat-card">

      <span id="movesDisplay">
        0
      </span>

      <small>
        挑戦回数
      </small>

    </div>

  </div>


  <div
    id="board"
    class="card-board"
  ></div>


  <div id="message"></div>

</div>

</div>


<!-- =========================
     切り抜きモーダル
========================= -->

<div id="cropModal">

  <div class="crop-panel">

    <h2>
      ✂️ 画像を切り抜く
    </h2>

    <p>
      画像をドラッグして位置を調整してください
    </p>


    <div id="cropArea">

      <img
        id="cropImage"
        draggable="false"
      >

      <div class="crop-guide"></div>

    </div>


    <button onclick="cancelCrop()">
      キャンセル
    </button>

    <button onclick="confirmCrop()">
      この位置で決定
    </button>

  </div>

</div>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://zuwhkhsviqfitfzpgcdy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_E09QP-l02lAr14I3p04wHg_2-1nE1TM";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   データ
========================= */

let people = [];

let selectedCards = [];

let lock = false;

let remainingPairs = 0;

let moves = 0;


/* =========================
   切り抜き用
========================= */

let cropFile = null;

let cropImageObject = null;

let cropScale = 1;

let cropX = 0;

let cropY = 0;

let dragging = false;

let dragStartX = 0;

let dragStartY = 0;

let startCropX = 0;

let startCropY = 0;


/* =========================
   サイト開始
========================= */

async function enterSite() {

  document
    .getElementById("startScreen")
    .style.display = "none";

  await loadPeople();

}


/* =========================
   人物読み込み
========================= */

async function loadPeople() {

  const {
    data: peopleData,
    error: peopleError
  } =
    await supabaseClient
      .from("people")
      .select("*")
      .order("id",{ascending:true});


  if (peopleError) {

    console.error(peopleError);

    alert(
      "人物データの読み込みに失敗しました\n" +
      peopleError.message
    );

    return;

  }


  const {
    data: imageData,
    error: imageError
  } =
    await supabaseClient
      .from("person_images")
      .select("*");


  if (imageError) {

    console.error(imageError);

    alert(
      "画像データの読み込みに失敗しました\n" +
      imageError.message
    );

    return;

  }


  people =
    peopleData.map(person => {

      const images =
        imageData
          .filter(image =>
            image.person_id === person.id
          )
          .map(image => {

            const {data} =
              supabaseClient
                .storage
                .from("images")
                .getPublicUrl(
                  image.image_path
                );


            return {

              id:
                image.id,

              path:
                image.image_path,

              url:
                data.publicUrl

            };

          });


      return {

        ...person,

        images

      };

    });


  renderPeople();

}


/* =========================
   人物追加
========================= */

async function addPerson() {

  const input =
    document.getElementById("personName");

  const name =
    input.value.trim();


  if (!name) {

    alert("人物名を入力してください");

    return;

  }


  const {error} =
    await supabaseClient
      .from("people")
      .insert({
        name:name
      });


  if (error) {

    alert(error.message);

    return;

  }


  input.value = "";

  await loadPeople();

}


/* =========================
   人物削除
========================= */

async function deletePerson(person) {

  if (
    !confirm(
      `「${person.name}」と画像を削除しますか？`
    )
  ) return;


  const paths =
    person.images.map(
      image => image.path
    );


  if (paths.length) {

    await supabaseClient
      .storage
      .from("images")
      .remove(paths);

  }


  const {error} =
    await supabaseClient
      .from("people")
      .delete()
      .eq("id",person.id);


  if (error) {

    alert(error.message);

    return;

  }


  await loadPeople();

}


/* =========================
   画像選択
========================= */

function selectImage(person,files) {

  if (!files || !files.length)
    return;


  cropFile = files[0];

  cropImageObject = null;

  const reader =
    new FileReader();


  reader.onload = function(e) {

    const img =
      new Image();


    img.onload = function() {

      cropImageObject = img;

      setupCrop();

    };


    img.src = e.target.result;

  };


  reader.readAsDataURL(cropFile);

}


/* =========================
   切り抜き準備
========================= */

function setupCrop() {

  const area =
    document.getElementById("cropArea");

  const img =
    document.getElementById("cropImage");


  const size =
    area.clientWidth;


  const iw =
    cropImageObject.width;

  const ih =
    cropImageObject.height;


  /*
   * 短い辺を
   * 正方形いっぱいにする
   */

  cropScale =
    size / Math.min(iw,ih);


  const displayWidth =
    iw * cropScale;

  const displayHeight =
    ih * cropScale;


  /*
   * 最初は中央
   */

  cropX =
    (size - displayWidth) / 2;

  cropY =
    (size - displayHeight) / 2;


  img.src =
    cropImageObject.src;


  updateCropImage();


  document
    .getElementById("cropModal")
    .style.display = "flex";

}


/* =========================
   画像位置更新
========================= */

function updateCropImage() {

  const img =
    document.getElementById("cropImage");


  img.style.width =
    (cropImageObject.width * cropScale)
    + "px";


  img.style.height =
    (cropImageObject.height * cropScale)
    + "px";


  img.style.left =
    cropX + "px";


  img.style.top =
    cropY + "px";

}


/* =========================
   ドラッグ開始
========================= */

function startDrag(x,y) {

  dragging = true;

  dragStartX = x;
  dragStartY = y;

  startCropX = cropX;
  startCropY = cropY;

}


/* =========================
   ドラッグ移動
========================= */

function moveDrag(x,y) {

  if (!dragging)
    return;


  cropX =
    startCropX +
    (x - dragStartX);


  cropY =
    startCropY +
    (y - dragStartY);


  const area =
    document.getElementById("cropArea");


  const size =
    area.clientWidth;


  const width =
    cropImageObject.width *
    cropScale;


  const height =
    cropImageObject.height *
    cropScale;


  /*
   * 画像が正方形から
   * はみ出さないようにする
   */

  cropX =
    Math.min(
      0,
      Math.max(
        size - width,
        cropX
      )
    );


  cropY =
    Math.min(
      0,
      Math.max(
        size - height,
        cropY
      )
    );


  updateCropImage();

}


/* =========================
   ドラッグ終了
========================= */

function endDrag() {

  dragging = false;

}


/* =========================
   マウス
========================= */

const cropArea =
  document.getElementById("cropArea");


cropArea.addEventListener(
  "mousedown",
  e => {

    startDrag(
      e.clientX,
      e.clientY
    );

  }
);


window.addEventListener(
  "mousemove",
  e => {

    moveDrag(
      e.clientX,
      e.clientY
    );

  }
);


window.addEventListener(
  "mouseup",
  endDrag
);


/* =========================
   タッチ
========================= */

cropArea.addEventListener(
  "touchstart",
  e => {

    const t =
      e.touches[0];

    startDrag(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);


cropArea.addEventListener(
  "touchmove",
  e => {

    e.preventDefault();

    const t =
      e.touches[0];

    moveDrag(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);


cropArea.addEventListener(
  "touchend",
  endDrag
);


/* =========================
   切り抜き確定
========================= */

async function confirmCrop() {

  if (!cropImageObject)
    return;


  const area =
    document.getElementById("cropArea");


  const size =
    area.clientWidth;


  const canvas =
    document.createElement("canvas");


  /*
   * 保存画像サイズ
   */

  const outputSize = 800;


  canvas.width =
    outputSize;

  canvas.height =
    outputSize;


  const ctx =
    canvas.getContext("2d");


  /*
   * cropArea上の位置を
   * 元画像の座標へ戻す
   */

  const sourceX =
    (-cropX) /
    cropScale;

  const sourceY =
    (-cropY) /
    cropScale;


  const sourceSize =
    size /
    cropScale;


  ctx.drawImage(

    cropImageObject,

    sourceX,
    sourceY,

    sourceSize,
    sourceSize,

    0,
    0,

    outputSize,
    outputSize

  );


  canvas.toBlob(
    async blob => {

      if (!blob) {

        alert(
          "画像の作成に失敗しました"
        );

        return;

      }


      /*
       * 新しい画像としてアップロード
       */

      await uploadCroppedImage(blob);

    },
    "image/jpeg",
    0.85
  );

}


/* =========================
   切り抜きキャンセル
========================= */

function cancelCrop() {

  document
    .getElementById("cropModal")
    .style.display = "none";

  cropFile = null;

  cropImageObject = null;

}


/* =========================
   現在のアップロード対象
========================= */

let uploadPerson = null;


/*
 * 元のselectImageを
 * 人物付きにする
 */

function openCrop(person,files) {

  if (!files || !files.length)
    return;


  uploadPerson = person;

  selectImage(
    person,
    files
  );

}


/* =========================
   切り抜き画像アップロード
========================= */

async function uploadCroppedImage(blob) {

  if (!uploadPerson) {

    alert(
      "人物情報がありません"
    );

    return;

  }


  const fileName =
    `${uploadPerson.id}/` +
    `${Date.now()}-` +
    `${Math.random()
      .toString(36)
      .substring(2)}.jpg`;


  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from("images")
      .upload(
        fileName,
        blob,
        {
          contentType:"image/jpeg"
        }
      );


  if (uploadError) {

    console.error(uploadError);

    alert(
      "画像のアップロードに失敗しました\n" +
      uploadError.message
    );

    return;

  }


  const {
    error: dbError
  } =
    await supabaseClient
      .from("person_images")
      .insert({

        person_id:
          uploadPerson.id,

        image_path:
          fileName

      });


  if (dbError) {

    console.error(dbError);

    alert(
      "画像情報の保存に失敗しました\n" +
      dbError.message
    );

    return;

  }


  document
    .getElementById("cropModal")
    .style.display = "none";


  cropFile = null;

  cropImageObject = null;

  uploadPerson = null;


  await loadPeople();

}


/* =========================
   画像削除
========================= */

async function deleteImage(image) {

  if (
    !confirm(
      "この画像を削除しますか？"
    )
  ) return;


  const {
    error: storageError
  } =
    await supabaseClient
      .storage
      .from("images")
      .remove([
        image.path
      ]);


  if (storageError) {

    alert(
      "Storageから画像を削除できませんでした\n" +
      storageError.message
    );

    return;

  }


  const {
    error: dbError
  } =
    await supabaseClient
      .from("person_images")
      .delete()
      .eq(
        "id",
        image.id
      );


  if (dbError) {

    alert(
      "画像情報を削除できませんでした\n" +
      dbError.message
    );

    return;

  }


  await loadPeople();

}


/* =========================
   人物一覧
========================= */

function renderPeople() {

  const list =
    document.getElementById(
      "personList"
    );


  list.innerHTML = "";


  people.forEach(person => {

    const personDiv =
      document.createElement("div");


    personDiv.className =
      "person";


    /*
     * ヘッダー
     */

    const header =
      document.createElement("div");


    header.className =
      "person-header";


    const title =
      document.createElement("h3");


    title.textContent =
      `${person.name}（画像 ${person.images.length}枚）`;


    header.appendChild(title);


    /*
     * 人物削除
     */

    const deleteButton =
      document.createElement("button");


    deleteButton.textContent =
      "人物を削除";


    deleteButton.onclick =
      () => deletePerson(person);


    header.appendChild(
      deleteButton
    );


    personDiv.appendChild(
      header
    );


    /*
     * 画像追加
     */

    const fileInput =
      document.createElement("input");


    fileInput.type =
      "file";

    fileInput.accept =
      "image/*";

    fileInput.multiple =
      true;


    fileInput.onchange =
      function(e) {

        const files =
          Array.from(
            e.target.files
          );


        /*
         * 1枚ずつ切り抜く
         *
         * 複数選択された場合は
         * 最初の1枚から処理
         */

        if (files.length) {

          openCrop(
            person,
            [files[0]]
          );

        }


        /*
         * inputをリセット
         * 同じ画像を再選択できる
         */

        fileInput.value = "";

      };


    personDiv.appendChild(
      fileInput
    );


    /*
     * 画像一覧
     */

    const imageList =
      document.createElement("div");


    imageList.className =
      "image-list";


    person.images.forEach(image => {

      const imageBox =
        document.createElement("div");


      imageBox.className =
        "image-box";


      /*
       * 画像
       */

      const img =
        document.createElement("img");


      img.src =
        image.url;


      /*
       * 画像クリック
       * → 再切り抜き
       */

      imageBox.onclick =
        function(e) {

          /*
           * 削除ボタンを押した場合は
           * 再切り抜きしない
           */

          if (
            e.target.classList.contains(
              "delete-image"
            )
          ) return;


          /*
           * URLから画像を読み込む
           */

          fetch(image.url)
            .then(res => res.blob())
            .then(blob => {

              uploadPerson =
                person;

              selectImage(
                person,
                [new File(
                  [blob],
                  "image.jpg",
                  {
                    type:
                      blob.type
                  }
                )]
              );

            })
            .catch(error => {

              console.error(error);

              alert(
                "画像を読み込めませんでした"
              );

            });

        };


      imageBox.appendChild(img);


      /*
       * 削除
       */

      const deleteImageButton =
        document.createElement("button");


      deleteImageButton.textContent =
        "×";


      deleteImageButton.className =
        "delete-image";


      deleteImageButton.onclick =
        function(e) {

          e.stopPropagation();

          deleteImage(image);

        };


      imageBox.appendChild(
        deleteImageButton
      );


      imageList.appendChild(
        imageBox
      );

    });


    personDiv.appendChild(
      imageList
    );


    list.appendChild(
      personDiv
    );

  });


  updateCounts();

}


/* =========================
   カウント
========================= */

function updateCounts() {

  document
    .getElementById("personCount")
    .textContent =
    people.length;


  const count =
    people.reduce(
      (total,person) =>
        total +
        person.images.length,
      0
    );


  document
    .getElementById("imageCount")
    .textContent =
    count;

}


/* =========================
   シャッフル
========================= */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================
   ゲーム開始
========================= */

function startGame() {

  const usablePeople =
    people.filter(
      person =>
        person.images.length >= 2
    );


  if (!usablePeople.length) {

    alert(
      "最低1人、画像を2枚以上追加してください"
    );

    return;

  }


  let cards = [];


  usablePeople.forEach(person => {

    const images =
      shuffle(
        [...person.images]
      ).slice(0,2);


    images.forEach(image => {

      cards.push({

        person:
          person.name,

        image:
          image.url

      });

    });

  });


  cards =
    shuffle(cards);


  document
    .getElementById("editor")
    .style.display =
    "none";


  document
    .getElementById("game")
    .style.display =
    "block";


  document
    .getElementById("message")
    .innerHTML =
    "";


  const board =
    document.getElementById("board");


  board.innerHTML = "";


  selectedCards = [];

  lock = false;

  moves = 0;

  remainingPairs =
    usablePeople.length;


  updateStatus();


  cards.forEach(card => {

    const cardElement =
      document.createElement("div");


    cardElement.className =
      "card";


    cardElement.dataset.person =
      card.person;


    const img =
      document.createElement("img");


    img.src =
      card.image;


    img.className =
      "hidden-image";


    cardElement.appendChild(img);


    cardElement.onclick =
      () => flipCard(cardElement);


    board.appendChild(
      cardElement
    );

  });

}


/* =========================
   ステータス
========================= */

function updateStatus() {

  document
    .getElementById(
      "remainingDisplay"
    )
    .textContent =
    remainingPairs;


  document
    .getElementById(
      "movesDisplay"
    )
    .textContent =
    moves;

}


/* =========================
   カード
========================= */

function flipCard(card) {

  if (lock)
    return;


  if (
    card.classList.contains(
      "completed"
    )
  )
    return;


  if (
    selectedCards.includes(card)
  )
    return;


  const img =
    card.querySelector("img");


  img.classList.remove(
    "hidden-image"
  );


  card.classList.add(
    "revealed"
  );


  selectedCards.push(card);


  if (
    selectedCards.length === 2
  ) {

    moves++;

    updateStatus();

    lock = true;

    setTimeout(
      checkPair,
      800
    );

  }

}


/* =========================
   ペア判定
========================= */

function checkPair() {

  if (
    selectedCards.length !== 2
  ) {

    lock = false;

    return;

  }


  const card1 =
    selectedCards[0];

  const card2 =
    selectedCards[1];


  if (
    card1.dataset.person ===
    card2.dataset.person
  ) {

    card1.classList.add(
      "completed"
    );

    card2.classList.add(
      "completed"
    );


    remainingPairs--;

    updateStatus();


    if (
      remainingPairs === 0
    ) {

      document
        .getElementById("message")
        .innerHTML = `

          <div class="clear-box">

            <h2>
              🎉 GAME CLEAR！
            </h2>

            <p>
              ${moves}回でクリアしました！
            </p>

            <button
              onclick="startGame()"
            >
              もう一度遊ぶ
            </button>

            <button
              onclick="backToEditor()"
            >
              編集画面へ
            </button>

          </div>

        `;

    }

  }

  else {

    card1
      .querySelector("img")
      .classList.add(
        "hidden-image"
      );


    card2
      .querySelector("img")
      .classList.add(
        "hidden-image"
      );


    card1.classList.remove(
      "revealed"
    );


    card2.classList.remove(
      "revealed"
    );

  }


  selectedCards = [];

  lock = false;

}


/* =========================
   編集画面
========================= */

function backToEditor() {

  document
    .getElementById("game")
    .style.display =
    "none";


  document
    .getElementById("editor")
    .style.display =
    "block";


  document
    .getElementById("message")
    .innerHTML =
    "";

}

</script>

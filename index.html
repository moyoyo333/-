/* =========================================================

/* =========================================================

/* =========================================================

========================================================= */

.container {

.stats,

.stat-box,

.stat-box span,

small {

/* =========================================================

========================================================= */

input[type="text"] {

/* =========================================================

/* =========================================================

========================================================= */

.image-list {

}

.image-box {

.image-buttons {

/* =========================================================
   ゲーム
========================================================= */

.card-board {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(100px, 1fr)

}

.card {

/* =========================================================

========================================================= */

.crop-area {

  overflow: hidden;

  background:
    #222;

  border-radius: 12px;

  touch-action: none;

  user-select: none;
}


/* =========================================================
   切り抜き画像
========================================================= */

#cropImage {

  position: absolute;

  display: block;

  max-width: none;
  max-height: none;

  user-select: none;

  -webkit-user-drag: none;

  cursor: grab;

  touch-action: none;

  z-index: 1;
}

#cropImage.dragging {
  cursor: grabbing;
}


/* =========================================================
   固定切り抜き枠
========================================================= */

#cropSquare {

  position: absolute;

  z-index: 5;

  pointer-events: none;

  border:
    3px solid white;

  box-shadow:
    0 0 0 9999px

    rgba(255,255,255,.7);

/* =========================================================

========================================================= */

.crop-controls {

.crop-controls input[type="range"] {

.loading {

/* =========================================================

@media (max-width: 600px) {

<script>

/* =========================================================
   Supabase設定
========================================================= */

const SUPABASE_URL =
  "https://zuwhkhsviqfitfzpgcdy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_E09QP-l02lAr14I3p04wHg_2-1nE1TM";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   データ
========================================================= */

let people = [];

let pendingImages = {};

let selectedCards = [];

let lock = false;

let remainingPairs = 0;

let moves = 0;


/* =========================================================
   切り抜き状態
========================================================= */

let cropState = {

  mode: "new",

  person: null,

  image: null,

  file: null,

  imageDataUrl: null,

  sourceImage: null,

  baseScale: 1,

  zoom: 1,

  imageLeft: 0,

  imageTop: 0,

  squareLeft: 0,

  squareTop: 0,

  squareSize: 0

};


/* =========================================================
   エラー監視
========================================================= */

window.addEventListener(
  "error",
  function(e) {

    showError(
      "JavaScript ERROR\n\n" +
      e.message +
      "\n\nLINE: " +
      e.lineno
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  function(e) {

    showError(
      "Promise ERROR\n\n" +
      e.reason
    );

  }
);


function showError(message) {

  console.error(message);

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "block";

  box.textContent =
    message;
}


/* =========================================================
   ローディング
========================================================= */

function showLoading(text = "保存中...") {

  const loading =
    document.getElementById(
      "loading"
    );

  loading.textContent =
    text;

  loading.style.display =
    "flex";
}


function hideLoading() {

  document
    .getElementById(
      "loading"
    )
    .style.display =
    "none";
}


/* =========================================================
   サイト開始
========================================================= */

async function enterSite() {

  document
    .getElementById(
      "startScreen"
    )
    .style.display =
    "none";

  await loadPeople();

}


/* =========================================================
   人物・画像読み込み
========================================================= */

async function loadPeople() {

  try {

    const {
      data: peopleData,
      error: peopleError
    } =
      await supabaseClient
        .from("people")
        .select("*")
        .order(
          "id",
          {
            ascending: true
          }
        );


    if (peopleError) {

      throw peopleError;

    }


    const {
      data: imageData,
      error: imageError
    } =
      await supabaseClient
        .from("person_images")
        .select("*")
        .order(
          "id",
          {
            ascending: true
          }
        );


    if (imageError) {

      throw imageError;

    }


    people =
      (peopleData || []).map(
        person => {

          const images =
            (imageData || [])
              .filter(
                image =>
                  String(
                    image.person_id
                  ) ===
                  String(
                    person.id
                  )
              )
              .map(
                image => {

                  const {
                    data
                  } =
                    supabaseClient
                      .storage
                      .from("images")
                      .getPublicUrl(
                        image.image_path
                      );


                  return {

                    id:
                      image.id,

                    path:
                      image.image_path,

                    url:
                      data.publicUrl

                  };

                }
              );


          return {

            ...person,

            images:
              images

          };

        }
      );


    renderPeople();

  }

  catch(error) {

    console.error(error);

    showError(
      "データ読み込み中にエラーが発生しました\n\n" +
      error.message
    );

  }

}


/* =========================================================
   人物追加
========================================================= */

async function addPerson() {

  const input =
    document.getElementById(
      "personName"
    );

  const name =
    input.value.trim();


  if (!name) {

    alert(
      "人物名を入力してください"
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("people")
      .insert({
        name: name
      });


  if (error) {

    alert(
      "人物の追加に失敗しました\n\n" +
      error.message
    );

    return;

  }


  input.value = "";

  await loadPeople();

}


/* =========================================================
   人物削除
========================================================= */

async function deletePerson(person) {

  if (
    !confirm(
      `「${person.name}」を削除しますか？\n\n登録されている画像もすべて削除されます。`
    )
  ) {

    return;

  }


  try {

    showLoading(
      "人物と画像を削除中..."
    );


    delete pendingImages[
      person.id
    ];


    const paths =
      person.images.map(
        image =>
          image.path
      );


    if (paths.length > 0) {

      const {
        error
      } =
      await supabaseClient
        .storage
        .from("images")
        .remove(
          paths
        );


      if (error) {

        throw error;

      }

    }


    const {
      error: imageDbError
    } =
    await supabaseClient
      .from("person_images")
      .delete()
      .eq(
        "person_id",
        person.id
      );


    if (imageDbError) {

      throw imageDbError;

    }


    const {
      error: personError
    } =
    await supabaseClient
      .from("people")
      .delete()
      .eq(
        "id",
        person.id
      );


    if (personError) {

      throw personError;

    }


    await loadPeople();

  }

  catch(error) {

    console.error(error);

    alert(
      "人物の削除に失敗しました\n\n" +
      error.message
    );

  }

  finally {

    hideLoading();

  }

}


/* =========================================================
   人物一覧描画
========================================================= */

function renderPeople() {

  const list =
    document.getElementById(
      "personList"
    );


  list.innerHTML = "";


  people.forEach(
    person => {

      const personDiv =
        document.createElement(
          "div"
        );

      personDiv.className =
        "person";


      const header =
        document.createElement(
          "div"
        );

      header.className =
        "person-header";


      const title =
        document.createElement(
          "h3"
        );


      const pendingCount =
        (
          pendingImages[
            person.id
          ] || []
        ).length;


      title.textContent =
        `${person.name}（画像 ${
          person.images.length +
          pendingCount
        }枚）`;


      header.appendChild(
        title
      );


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.textContent =
        "人物を削除";

      deleteButton.className =
        "delete-button";

      deleteButton.onclick =
        () =>
          deletePerson(
            person
          );


      header.appendChild(
        deleteButton
      );

      personDiv.appendChild(
        header
      );


      /* =====================================================
         ファイル入力
      ===================================================== */

      const fileInput =
        document.createElement(
          "input"
        );

      fileInput.type =
        "file";

      fileInput.accept =
        "image/*";

      fileInput.multiple =
        true;


      fileInput.onchange =
        async function(e) {

          const files =
            Array.from(
              e.target.files
            );


          if (
            files.length === 0
          ) {

            return;

          }


          await addPendingImages(
            person,
            files
          );


          fileInput.value = "";

        };


      personDiv.appendChild(
        fileInput
      );


      /* =====================================================
         画像一覧
      ===================================================== */

      const imageList =
        document.createElement(
          "div"
        );

      imageList.className =
        "image-list";


      /* 保存済み */

      person.images.forEach(
        image => {

          createSavedImageBox(
            imageList,
            person,
            image
          );

        }
      );


      /* 未保存 */

      const pending =
        pendingImages[
          person.id
        ] || [];


      pending.forEach(
        pendingImage => {

          createPendingImageBox(
            imageList,
            person,
            pendingImage
          );

        }
      );


      personDiv.appendChild(
        imageList
      );

      list.appendChild(
        personDiv
      );

    }
  );


  updateCounts();

}

/* =========================================================
   画像追加
========================================================= */

async function addPendingImages(
  person,
  files
) {

  if (
    !pendingImages[
      person.id
    ]
  ) {

    pendingImages[
      person.id
    ] = [];

  }


  for (
    const file of files
  ) {

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      continue;

    }


    try {

      const dataUrl =
        await fileToDataURL(
          file
        );


      pendingImages[
        person.id
      ].push({

        id:
          createUniqueId(),

        file:
          file,

        dataUrl:
          dataUrl,

        previewUrl:
          dataUrl

      });

    }

    catch(error) {

      console.error(error);

      alert(
        `${file.name} の読み込みに失敗しました`
      );

    }

  }


  renderPeople();

}


/* =========================================================
   ID生成
========================================================= */

function createUniqueId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2)
  );

}


/* =========================================================
   保留画像削除
========================================================= */

function deletePendingImage(
  person,
  pendingImage
) {

  if (
    !confirm(
      "この画像を削除しますか？"
    )
  ) {

    return;

  }


  pendingImages[
    person.id
  ] =
    (
      pendingImages[
        person.id
      ] || []
    ).filter(
      image =>
        image.id !==
        pendingImage.id
    );


  renderPeople();

}

function updateCounts() {

  const savedCount =
    people.reduce(

      ) =>

      0
    );


  const pendingCount =
    Object.values(

    );

    )

}


/* =========================================================
   File → DataURL
========================================================= */

function fileToDataURL(file) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        () =>
          reject(
            reader.error
          );


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   DataURL → Image
========================================================= */

function loadImageFromDataURL(
  dataUrl
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();


      img.onload =
        () =>
          resolve(
            img
          );


      img.onerror =
        () =>
          reject(
            new Error(
              "画像を読み込めませんでした"
            )
          );


      img.src =
        dataUrl;

    }
  );

}


/* =========================================================
   URL → Image
========================================================= */

function loadImageFromURL(
  url
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();


      /*
        Supabase Storageの画像を
        Canvasで使用するため
      */

      img.crossOrigin =
        "anonymous";


      img.onload =
        () =>
          resolve(
            img
          );


      img.onerror =
        () =>
          reject(
            new Error(
              "画像を読み込めませんでした"
            )
          );


      /*
        キャッシュによる問題を避ける
      */

      img.src =
        url +
        (
          url.includes("?")
            ? "&"
            : "?"
        ) +
        "crop=" +
        Date.now();

    }
  );

}


/* =========================================================
   未切り抜き画像を開く
========================================================= */

async function openCropForPendingImage(
  person,
  pendingImage
) {

  try {

    const img =
      await loadImageFromDataURL(
        pendingImage.dataUrl
      );


    cropState = {

      mode:
        "pending",

      person:
        person,

      image:
        pendingImage,

      file:
        pendingImage.file,

      imageDataUrl:
        pendingImage.dataUrl,

      sourceImage:
        img,

      baseScale:
        1,

      zoom:
        1,

      imageLeft:
        0,

      imageTop:
        0,

      squareLeft:
        0,

      squareTop:
        0,

      squareSize:
        0

    };


    showCropModal();

  }

  catch(error) {

    console.error(error);

    alert(
      "画像の読み込みに失敗しました\n\n" +
      error.message
    );

  }

}


/* =========================================================
   新規画像
========================================================= */

async function openCropForNewImage(
  person,
  file
) {

  try {

    const dataUrl =
      await fileToDataURL(
        file
      );


    const img =
      await loadImageFromDataURL(
        dataUrl
      );


    const pendingImage = {

      id:
        createUniqueId(),

      file:
        file,

      dataUrl:
        dataUrl,

      previewUrl:
        dataUrl

    };


    if (
      !pendingImages[
        person.id
      ]
    ) {

      pendingImages[
        person.id
      ] = [];

    }


    pendingImages[
      person.id
    ].push(
      pendingImage
    );


    renderPeople();


    await openCropForPendingImage(
      person,
      pendingImage
    );

  }

  catch(error) {

    console.error(error);

    alert(
      "画像の読み込みに失敗しました\n\n" +
      error.message
    );

  }

}


/* =========================================================
   既存画像の再切り抜き
========================================================= */

async function openCropForExistingImage(
  person,
  image
) {

  try {

    /*
      現在Supabaseに保存されている
      最新の切り抜き画像を使用
    */

    const imageUrl =
      image.url;


    /*
      Supabaseから直接読み込む
    */

    const img =
      await loadImageFromURL(
        imageUrl
      );


    /*
      Canvas用DataURL
    */

    let dataUrl;


    try {

      const response =
        await fetch(
          imageUrl +
          (
            imageUrl.includes("?")
              ? "&"
              : "?"
          ) +
          "download=" +
          Date.now()
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "画像を取得できませんでした"
        );

      }


      const blob =
        await response.blob();


      dataUrl =
        await fileToDataURL(
          blob
        );

    }

    catch(fetchError) {

      console.warn(
        "DataURL変換に失敗。URLをそのまま使用します。",
        fetchError
      );

      dataUrl =
        imageUrl;

    }


    cropState = {

      mode:
        "existing",

      person:
        person,

      image:
        image,

      file:
        null,

      imageDataUrl:
        dataUrl,

      sourceImage:
        img,

      baseScale:
        1,

      zoom:
        1,

      imageLeft:
        0,

      imageTop:
        0,

      squareLeft:
        0,

      squareTop:
        0,

      squareSize:
        0

    };


    showCropModal();

  }

  catch(error) {

    console.error(
      "既存画像読み込みエラー",
      error
    );


    alert(
      "既存画像を読み込めませんでした。\n\n" +
      error.message
    );

  }

}

/* =========================================================
   切り抜きエリア初期化
========================================================= */

function setupCropArea() {

  const area =
    document.getElementById(
      "cropArea"
    );


  const image =
    cropState.sourceImage;


  if (!image) {

    return;

  }


  const naturalWidth =
    image.naturalWidth;


  const naturalHeight =
    image.naturalHeight;


  const areaWidth =
    area.clientWidth;


  const areaHeight =
    area.clientHeight;


  /*
    白枠サイズ

    画面に収まる範囲で、
    できるだけ大きな正方形
  */

  cropState.squareSize =
    Math.min(
      areaWidth,
      areaHeight
    ) * 0.9;


  /*
    画像が白枠を完全に覆う倍率
  */

  cropState.baseScale =
    Math.max(

      cropState.squareSize /
        naturalWidth,

      cropState.squareSize /
        naturalHeight

    );


  cropState.zoom =
    1;


  /*
    白枠中央
  */

  cropState.squareLeft =
    (
      areaWidth -
      cropState.squareSize
    ) / 2;


  cropState.squareTop =
    (
      areaHeight -
      cropState.squareSize
    ) / 2;


  /*
    画像を白枠中央へ
  */

  const imageWidth =
    naturalWidth *
    cropState.baseScale;


  const imageHeight =
    naturalHeight *
    cropState.baseScale;


  cropState.imageLeft =
    cropState.squareLeft +
    cropState.squareSize / 2 -
    imageWidth / 2;


  cropState.imageTop =
    cropState.squareTop +
    cropState.squareSize / 2 -
    imageHeight / 2;


  updateCropDisplay();

}


/* =========================================================
   切り抜き表示更新
========================================================= */

function updateCropDisplay() {

  const image =
    document.getElementById(
      "cropImage"
    );


  const square =
    document.getElementById(
      "cropSquare"
    );


  if (
    !cropState.sourceImage
  ) {

    return;

  }


  const imageWidth =
    cropState.sourceImage.naturalWidth *
    cropState.baseScale *
    cropState.zoom;


  const imageHeight =
    cropState.sourceImage.naturalHeight *
    cropState.baseScale *
    cropState.zoom;


  /*
    画像が枠を覆うための移動範囲
  */

  const minLeft =
    cropState.squareLeft +
    cropState.squareSize -
    imageWidth;


  const maxLeft =
    cropState.squareLeft;


  const minTop =
    cropState.squareTop +
    cropState.squareSize -
    imageHeight;


  const maxTop =
    cropState.squareTop;


  cropState.imageLeft =
    Math.max(
      minLeft,
      Math.min(
        maxLeft,
        cropState.imageLeft
      )
    );


  cropState.imageTop =
    Math.max(
      minTop,
      Math.min(
        maxTop,
        cropState.imageTop
      )
    );


  image.style.width =
    imageWidth + "px";


  image.style.height =
    imageHeight + "px";


  image.style.left =
    cropState.imageLeft + "px";


  image.style.top =
    cropState.imageTop + "px";


  square.style.width =
    cropState.squareSize + "px";


  square.style.height =
    cropState.squareSize + "px";


  square.style.left =
    cropState.squareLeft + "px";


  square.style.top =
    cropState.squareTop + "px";

}


/* =========================================================
   ドラッグ操作
========================================================= */

const cropArea =
  document.getElementById(
    "cropArea"
  );


const cropImageElement =
  document.getElementById(
    "cropImage"
  );


let imageDragging =
  false;


let dragStartX =
  0;


let dragStartY =
  0;


let dragStartImageLeft =
  0;


let dragStartImageTop =
  0;


/*
  PCマウス
  スマホタッチ
  両対応
*/

cropArea.addEventListener(
  "pointerdown",
  function(e) {

    if (
      !cropState.sourceImage
    ) {

      return;

    }


    imageDragging =
      true;


    dragStartX =
      e.clientX;


    dragStartY =
      e.clientY;


    dragStartImageLeft =
      cropState.imageLeft;


    dragStartImageTop =
      cropState.imageTop;


    try {

      cropArea.setPointerCapture(
        e.pointerId
      );

    }

    catch(error) {}


    cropImageElement.classList.add(
      "dragging"
    );


    e.preventDefault();

  }
);


cropArea.addEventListener(
  "pointermove",
  function(e) {

    if (
      !imageDragging
    ) {

      return;

    }


    const dx =
      e.clientX -
      dragStartX;


    const dy =
      e.clientY -
      dragStartY;


    cropState.imageLeft =
      dragStartImageLeft +
      dx;


    cropState.imageTop =
      dragStartImageTop +
      dy;


    updateCropDisplay();


    e.preventDefault();

  }
);


function stopImageDragging() {

  imageDragging =
    false;

  cropImageElement.classList.remove(
    "dragging"
  );

}


cropArea.addEventListener(
  "pointerup",
  stopImageDragging
);


cropArea.addEventListener(
  "pointercancel",
  stopImageDragging
);


cropArea.addEventListener(
  "pointerleave",
  function() {

    /*
      PCでマウスを外した場合のみ終了。
      タッチ操作ではpointer captureが効く。
    */

    if (
      !("ontouchstart" in window)
    ) {

      stopImageDragging();

    }

  }
);


/* =========================================================
   ズーム
========================================================= */

document
  .getElementById(
    "zoomRange"
  )
  .addEventListener(
    "input",
    function() {

      if (
        !cropState.sourceImage
      ) {

        return;

      }


      const oldZoom =
        cropState.zoom;


      const newZoom =
        parseFloat(
          this.value
        );


      const centerX =
        cropState.squareLeft +
        cropState.squareSize / 2;


      const centerY =
        cropState.squareTop +
        cropState.squareSize / 2;


      const oldWidth =
        cropState.sourceImage.naturalWidth *
        cropState.baseScale *
        oldZoom;


      const oldHeight =
        cropState.sourceImage.naturalHeight *
        cropState.baseScale *
        oldZoom;


      /*
        画像上の同じ位置を維持
      */

      const relativeX =
        (
          centerX -
          cropState.imageLeft
        ) /
        oldWidth;


      const relativeY =
        (
          centerY -
          cropState.imageTop
        ) /
        oldHeight;


      cropState.zoom =
        newZoom;


      const newWidth =
        cropState.sourceImage.naturalWidth *
        cropState.baseScale *
        newZoom;


      const newHeight =
        cropState.sourceImage.naturalHeight *
        cropState.baseScale *
        newZoom;


      cropState.imageLeft =
        centerX -
        relativeX *
        newWidth;


      cropState.imageTop =
        centerY -
        relativeY *
        newHeight;


      updateCropDisplay();


      document
        .getElementById(
          "zoomText"
        )
        .textContent =
        Math.round(
          newZoom * 100
        ) +
        "%";

    }
  );

  };

}


/* =========================================================
   切り抜きBlob生成
========================================================= */

async function createCroppedBlob() {

  const image =
    cropState.sourceImage;


  if (!image) {

    throw new Error(
      "元画像がありません"
    );

  }


  const displayScale =
    cropState.baseScale *
    cropState.zoom;


  /*
    表示座標 → 元画像座標
  */

  let sx =
    (
      cropState.squareLeft -
      cropState.imageLeft
    ) /
    displayScale;


  let sy =
    (
      cropState.squareTop -
      cropState.imageTop
    ) /
    displayScale;


  let size =
    cropState.squareSize /
    displayScale;


  /*
    範囲補正
  */

  sx =
    Math.max(
      0,
      Math.min(
        image.naturalWidth -
        size,
        sx
      )
    );


  sy =
    Math.max(
      0,
      Math.min(
        image.naturalHeight -
        size,
        sy
      )
    );


  size =
    Math.min(
      size,

      image.naturalWidth -
      sx,

      image.naturalHeight -
      sy

    );


  if (
    size <= 0 ||
    !Number.isFinite(size)
  ) {

    throw new Error(
      "切り抜き範囲が不正です"
    );

  }


  /*
    高画質出力
  */

  const outputSize =
    1000;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    outputSize;

  canvas.height =
    outputSize;


  const ctx =
    canvas.getContext(
      "2d"
    );


  if (!ctx) {

    throw new Error(
      "Canvasを使用できません"
    );

  }


  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    image,

    sx,
    sy,
    size,
    size,

    0,
    0,
    outputSize,
    outputSize

  );


  return new Promise(
    (
      resolve,
      reject
    ) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                "画像の生成に失敗しました"
              )
            );

            return;

          }


          resolve(
            blob
          );

        },

        "image/jpeg",

        0.90

      );

    }
  );

}

/* =========================================================
   切り抜き保存
========================================================= */

async function saveCrop() {

  const saveButton =
    document.getElementById(
      "saveCropButton"
    );


  if (
    saveButton.disabled
  ) {

    return;

  }


  saveButton.disabled =
    true;

  saveButton.textContent =
    "保存中...";


  try {

    const blob =
      await createCroppedBlob();


    /* =====================================================
       未切り抜き画像
    ===================================================== */

    if (
      cropState.mode ===
      "pending"
    ) {

      await saveNewCroppedImage(
        blob
      );

    }


    /* =====================================================
       既存画像の再切り抜き
    ===================================================== */

    else if (
      cropState.mode ===
      "existing"
    ) {

      await replaceExistingImage(
        blob
      );

    }


    closeCropModal();

    await loadPeople();

  }

  catch(error) {

    console.error(
      "切り抜き保存エラー",
      error
    );


    alert(
      "画像の保存に失敗しました\n\n" +
      error.message
    );

  }

  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      "✂️ この範囲で保存";

    hideLoading();

  }

}


/* =========================================================
   新規切り抜き画像を保存
========================================================= */

async function saveNewCroppedImage(
  blob
) {

  const person =
    cropState.person;


  const pendingImage =
    cropState.image;


  const fileName =
    createImagePath(
      person.id
    );


  showLoading(
    "画像を保存中..."
  );


  /*
    Storageへアップロード
  */

  const {
    error:
      uploadError
  } =
  await supabaseClient
    .storage
    .from("images")
    .upload(
      fileName,
      blob,
      {

        contentType:
          "image/jpeg",

        cacheControl:
          "3600",

        upsert:
          false

      }
    );


  if (uploadError) {

    throw uploadError;

  }


  /*
    DBへ登録
  */

  const {
    error:
      dbError
  } =
  await supabaseClient
    .from("person_images")
    .insert({

      person_id:
        person.id,

      image_path:
        fileName

    });


  /*
    DB登録失敗時
    → Storageに残った新画像を削除
  */

  if (dbError) {

    await supabaseClient
      .storage
      .from("images")
      .remove([
        fileName
      ]);


    throw dbError;

  }


  /*
    保留画像を削除
  */

  pendingImages[
    person.id
  ] =
    (
      pendingImages[
        person.id
      ] || []
    ).filter(
      image =>
        image.id !==
        pendingImage.id
    );

}


/* =========================================================
   既存画像を新画像へ交換
========================================================= */

async function replaceExistingImage(
  newBlob
) {

  const image =
    cropState.image;


  if (!image) {

    throw new Error(
      "対象画像がありません"
    );

  }


  showLoading(
    "新しい画像を保存中..."
  );


  /*
    ==========================================
    1. 新しい画像をStorageへ保存
    ==========================================
  */

  const newPath =
    createImagePath(
      cropState.person.id
    );


  const {
    error:
      uploadError
  } =
  await supabaseClient
    .storage
    .from("images")
    .upload(
      newPath,
      newBlob,
      {

        contentType:
          "image/jpeg",

        cacheControl:
          "3600",

        upsert:
          false

      }
    );


  if (uploadError) {

    throw uploadError;

  }


  /*
    ==========================================
    2. DBの参照先を新画像へ変更
    ==========================================
  */

  const {
    error:
      updateError
  } =
  await supabaseClient
    .from("person_images")
    .update({

      image_path:
        newPath

    })
    .eq(
      "id",
      image.id
    );


  /*
    DB更新失敗
    → 新画像を削除して元に戻す
  */

  if (updateError) {

    await supabaseClient
      .storage
      .from("images")
      .remove([
        newPath
      ]);


    throw updateError;

  }


  /*
    ==========================================
    3. 古い画像をStorageから削除
    ==========================================
  */

  const oldPath =
    image.path;


  if (
    oldPath &&
    oldPath !== newPath
  ) {

    const {
      error:
        deleteOldError
    } =
    await supabaseClient
      .storage
      .from("images")
      .remove([
        oldPath
      ]);


    /*
      DB更新は成功しているため、
      古い画像削除失敗だけでは
      新しい画像への変更を戻さない。
    */

    if (deleteOldError) {

      console.warn(
        "古い画像の削除に失敗しました:",
        deleteOldError
      );

    }

  }


  /*
    画面側のデータも更新
  */

  const {
    data
  } =
  supabaseClient
    .storage
    .from("images")
    .getPublicUrl(
      newPath
    );


  image.path =
    newPath;


  image.url =
    data.publicUrl;


  /*
    重要：
    以前のoriginalUrl方式は使用しない。

    常に「現在の保存済み切り抜き画像」を
    次回の切り抜き元にする。
  */

}


/* =========================================================
   画像削除
========================================================= */

async function deleteImage(
  image
) {

  if (
    !confirm(
      "この画像を削除しますか？"
    )
  ) {

    return;

  }


  try {

    showLoading(
      "画像を削除中..."
    );


    /*
      Storage削除
    */

    const {
      error:
        storageError
    } =
    await supabaseClient
      .storage
      .from("images")
      .remove([
        image.path
      ]);


    if (storageError) {

      throw storageError;

    }


    /*
      DB削除
    */

    const {
      error:
        dbError
    } =
    await supabaseClient
      .from("person_images")
      .delete()
      .eq(
        "id",
        image.id
      );


    if (dbError) {

      throw dbError;

    }


    await loadPeople();

  }

  catch(error) {

    console.error(error);

    alert(
      "画像の削除に失敗しました\n\n" +
      error.message
    );

  }

  finally {

    hideLoading();

  }

}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(array) {

  for (
    let i =
      array.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================================================
   ゲーム開始
========================================================= */

function startGame() {

  /*
    未切り抜き画像確認
  */

  const pendingCount =
    Object.values(
      pendingImages
    ).reduce(
      (
        total,
        images
      ) =>
        total +
        images.length,
      0
    );


  if (
    pendingCount > 0
  ) {

    alert(
      "まだ切り抜いていない画像があります。\n\n" +
      "画像の「✂️ 切り抜き」を完了してください。"
    );

    return;

  }


  /*
    2枚以上ある人物だけ
  */

  const usablePeople =
    people.filter(
      person =>
        person.images.length >= 2
    );


  if (
    usablePeople.length === 0
  ) {

    alert(
      "最低1人、画像を2枚以上登録してください。"
    );

    return;

  }


  let cards = [];


  usablePeople.forEach(
    person => {

      const images =
        shuffle(
          [
            ...person.images
          ]
        );


      /*
        各人物から2枚
      */

      const selected =
        images.slice(
          0,
          2
        );


      selected.forEach(
        image => {

          cards.push({

            person:
              String(
                person.id
              ),

            personName:
              person.name,

            image:
              image.url

          });

        }
      );

    }
  );


  shuffle(cards);


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "game"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";


  const board =
    document.getElementById(
      "board"
    );


  board.innerHTML =
    "";


  selectedCards = [];

  lock = false;

  moves = 0;

  remainingPairs =
    usablePeople.length;


  updateStatus();


  cards.forEach(
    card => {

      const cardElement =
        document.createElement(
          "div"
        );


      cardElement.className =
        "card";


      cardElement.dataset.person =
        card.person;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        card.image;


      img.className =
        "hidden-image";


      cardElement.appendChild(
        img
      );


      cardElement.onclick =
        () =>
          flipCard(
            cardElement
          );


      board.appendChild(
        cardElement
      );

    }
  );

}


/* =========================================================
   ステータス
========================================================= */

function updateStatus() {

  document
    .getElementById(
      "remainingDisplay"
    )
    .textContent =
    remainingPairs;


  document
    .getElementById(
      "movesDisplay"
    )
    .textContent =
    moves;

}


/* =========================================================
   カードをめくる
========================================================= */

function flipCard(
  card
) {

  if (lock) {

    return;

  }


  if (
    card.classList.contains(
      "completed"
    )
  ) {

    return;

  }


  if (
    selectedCards.includes(
      card
    )
  ) {

    return;

  }


  const img =
    card.querySelector(
      "img"
    );


  img.classList.remove(
    "hidden-image"
  );


  card.classList.add(
    "revealed"
  );


  selectedCards.push(
    card
  );


  if (
    selectedCards.length === 2
  ) {

    moves++;

    updateStatus();

    lock = true;


    setTimeout(
      checkPair,
      800
    );

  }

}


/* =========================================================
   ペア判定
========================================================= */

function checkPair() {

  const card1 =
    selectedCards[0];


  const card2 =
    selectedCards[1];


  if (
    !card1 ||
    !card2
  ) {

    selectedCards = [];

    lock = false;

    return;

  }


  const person1 =
    card1.dataset.person;


  const person2 =
    card2.dataset.person;


  if (
    person1 === person2
  ) {

    card1.classList.add(
      "completed"
    );


    card2.classList.add(
      "completed"
    );


    remainingPairs--;

    updateStatus();


    if (
      remainingPairs === 0
    ) {

      document
        .getElementById(
          "message"
        )
        .innerHTML = `

          <div class="clear-box">

            <h2>
              🎉 GAME CLEAR！
            </h2>

            <p>
              ${moves}回でクリアしました！
            </p>

            <button
              onclick="startGame()"
            >
              もう一度遊ぶ
            </button>

            <button
              onclick="backToEditor()"
            >
              編集画面へ
            </button>

          </div>

        `;

    }

  }

  else {

    card1
      .querySelector(
        "img"
      )
      .classList.add(
        "hidden-image"
      );


    card2
      .querySelector(
        "img"
      )
      .classList.add(
        "hidden-image"
      );


    card1.classList.remove(
      "revealed"
    );


    card2.classList.remove(
      "revealed"
    );

  }


  selectedCards = [];

  lock = false;

}


/* =========================================================
   編集画面へ
========================================================= */

function backToEditor() {

  document
    .getElementById(
      "game"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";

}


/* =========================================================
   Enterキー
========================================================= */

document
  .getElementById(
    "personName"
  )
  .addEventListener(
    "keydown",
    function(e) {

      if (
        e.key === "Enter"
      ) {

        addPerson();

      }

    }
  );


/* =========================================================
   ウィンドウサイズ変更
========================================================= */

window.addEventListener(
  "resize",
  function() {

    const modal =
      document.getElementById(
        "cropModal"
      );


    if (
      modal.style.display ===
      "flex" &&
      cropState.sourceImage
    ) {

      /*
        現在位置をできるだけ維持しながら
        表示を更新
      */

      const area =
        document.getElementById(
          "cropArea"
        );


      const newWidth =
        area.clientWidth;


      const newHeight =
        area.clientHeight;


      const oldSquareSize =
        cropState.squareSize;


      /*
        枠を再計算
      */

      cropState.squareSize =
        Math.min(
          newWidth,
          newHeight
        ) * 0.9;


      cropState.squareLeft =
        (
          newWidth -
          cropState.squareSize
        ) / 2;


      cropState.squareTop =
        (
          newHeight -
          cropState.squareSize
        ) / 2;


      /*
        画面サイズが変わった場合は
        画像を枠中央へ再配置
      */

      if (
        oldSquareSize !==
        cropState.squareSize
      ) {

        const imageWidth =
          cropState.sourceImage.naturalWidth *
          cropState.baseScale *
          cropState.zoom;


        const imageHeight =
          cropState.sourceImage.naturalHeight *
          cropState.baseScale *
          cropState.zoom;


        cropState.imageLeft =
          cropState.squareLeft +
          cropState.squareSize / 2 -
          imageWidth / 2;


        cropState.imageTop =
          cropState.squareTop +
          cropState.squareSize / 2 -
          imageHeight / 2;

      }


      updateCropDisplay();

    }

  );


/* =========================================================
   Escで切り抜きキャンセル
========================================================= */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Escape"
    ) {

      const modal =
        document.getElementById(
          "cropModal"
        );


      if (
        modal.style.display ===
        "flex"
      ) {

        closeCropModal();

      }

    }

  }
);

</script>

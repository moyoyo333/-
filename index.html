https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2script>

<body>

<header>

<div class="stats">

<div class="container">

  <!-- 作成画面 -->



<h2>人物を追加</h2>

<input
  type="text"

>

<button onclick="addPerson()">
  人物を追加
</button>


    <br>

    <button onclick="startGame()">

    </button>

  </div>


  <!-- ゲーム画面 -->

  <div id="game" class="panel">

    <button onclick="backToEditor()">
      編集画面に戻る
    </button>

    <h2>神経衰弱</h2>

    <div class="game-stats">

  <div class="stat-card">

    <span id="remainingDisplay">
      0
    </span>

    <small>残り組数</small>

  </div>

  <div class="stat-card">

    <span id="movesDisplay">
      0
    </span>

    <small>挑戦回数</small>

  </div>

</div>


    <div id="board" class="card-board"></div>

    <div id="message"></div>

  </div>
  
</div>

<script>

const SUPABASE_URL =
"https://zuwhkhsviqfitfzpgcdy.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_E09QP-l02lAr14I3p04wHg_2-1nE1TM";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function compressImage(file) {

  return new Promise((resolve) => {

    const reader = new FileReader();

    reader.onload = function (event) {

      const img = new Image();

      img.onload = function () {

        const canvas =
          document.createElement("canvas");

        const maxWidth = 800;

        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {

          height =
            height *
            maxWidth /
            width;

          width =
            maxWidth;

        }

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        const compressed =
          canvas.toDataURL(
            "image/jpeg",
            0.7
          );

        resolve(compressed);

      };

      img.src = event.target.result;

    };

    reader.readAsDataURL(file);

  });

}



let people = [];
const saved =
  localStorage.getItem(
    "people"
  );

if (saved) {

  people =
    JSON.parse(saved);

}


/*
people のデータ例

[
  {
    name: "初音ミク",
    images: [
      "画像データ",
      "画像データ"
    ]
  }
]

*/




async function addPerson() {

  const nameInput =
    document.getElementById("personName");

  const name =
    nameInput.value.trim();


  if (name === "") {

    alert("人物名を入力してください");

    return;

  }


  await supabase
  .from("people")
  .insert({
    name: name
  });

loadPeople();

  
  async function loadPeople() {

  const { data, error } =
    await supabase
      .from("people")
      .select("*");

  if(error){

    console.error(error);

    return;

  }

  people = data.map(
    person => ({
      ...person,
      images:[]
    })
  );

  renderPeople();

}



  nameInput.value = "";

saveData();

renderPeople();


}



/* 人物一覧を表示 */

function renderPeople() {

  const list =
    document.getElementById("personList");


  list.innerHTML = "";


  people.forEach((person, personIndex) => {

    const personDiv =
      document.createElement("div");


    personDiv.className =
      "person";


    /* 人物名 */

    const header =
      document.createElement("div");


    header.className =
      "person-header";


    const title =
      document.createElement("h3");


    title.textContent =
      person.name +
      "（画像 " +
      person.images.length +
      "枚）";


    header.appendChild(title);


    /* 人物削除 */

    const deletePersonButton =
      document.createElement("button");


    deletePersonButton.textContent =
      "人物を削除";


    deletePersonButton.onclick =
      function () {

        people.splice(
  personIndex,
  1
);

saveData();

renderPeople();


      };


    header.appendChild(
      deletePersonButton
    );


    personDiv.appendChild(
      header
    );


    /* 画像追加 */

    const fileInput =
      document.createElement("input");


    fileInput.type =
      "file";


    fileInput.accept =
      "image/*";


    fileInput.multiple =
      true;


    fileInput.onchange =
      function (event) {

        const files =
          event.target.files;


        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          const reader =
            new FileReader();


          reader.onload =
            function (e) {

             (async () => {

  const compressed =
    await compressImage(
      files[i]
    );

  person.images.push(
    compressed
  );

  saveData();

  renderPeople();

})();


        }

      };


    personDiv.appendChild(
      fileInput
    );


    /* 画像一覧 */

    const imageList =
      document.createElement("div");


    imageList.className =
      "image-list";


    person.images.forEach(
      (
        image,
        imageIndex
      ) => {

        const imageBox =
          document.createElement("div");


        imageBox.className =
          "image-box";


        const img =
          document.createElement("img");


        img.src =
          image;


        imageBox.appendChild(
          img
        );


        /* 画像削除 */

        const deleteButton =
          document.createElement("button");


        deleteButton.textContent =
          "×";


        deleteButton.className =
          "delete-image";


        deleteButton.onclick =
          function () {

            person.images.splice(
              imageIndex,
              1
            );

saveData();
            renderPeople();

          };


        imageBox.appendChild(
          deleteButton
        );


        imageList.appendChild(
          imageBox
        );

      }
    );


    personDiv.appendChild(
      imageList
    );


    list.appendChild(
      personDiv
    );

  });

}



/* 配列をランダムに並び替える */

function shuffle(array) {

  for (
    let i =
      array.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ]
      =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}



let selectedCards =
  [];


let lock =
  false;


let remainingPairs =
  0;


let moves =
  0;



function startGame() {

  /*
  画像が2枚以上ある人物だけ使う
  */

  const usablePeople =
    people.filter(
      person =>
        person.images.length >= 2
    );


  if (
    usablePeople.length === 0
  ) {

    alert(
      "最低1人、画像を2枚以上追加してください"
    );


    return;

  }


  let cards = [];


  usablePeople.forEach(
    person => {

      /*
      何枚画像を追加していても
      ランダムに2枚選ぶ
      */

      const shuffledImages =
        shuffle(
          [...person.images]
        );


      const selectedImages =
        shuffledImages.slice(
          0,
          2
        );


      selectedImages.forEach(
        image => {

          cards.push({

            person:
              person.name,

            image:
              image

          });

        }
      );

    }
  );


  cards =
    shuffle(cards);


  document
    .getElementById("editor")
    .style.display =
      "none";


  document
    .getElementById("game")
    .style.display =
      "block";


  const board =
    document.getElementById(
      "board"
    );


  board.innerHTML =
    "";


  selectedCards =
    [];


  lock =
    false;


  moves =
    0;


  remainingPairs =
    usablePeople.length;


  updateStatus();


  cards.forEach(
    (
      card,
      index
    ) => {

      const cardElement =
        document.createElement(
          "div"
        );


      cardElement.className =
        "card";


      cardElement.dataset.person =
        card.person;


      cardElement.dataset.index =
        index;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        card.image;


      img.className =
        "hidden-image";


      cardElement.appendChild(
        img
      );


      cardElement.onclick =
        function () {

          flipCard(
            cardElement
          );

        };


      board.appendChild(
        cardElement
      );

    }
  );

}



function updateStatus() {

  document
    .getElementById(
      "remainingDisplay"
    )
    .textContent =
      remainingPairs;

  document
    .getElementById(
      "movesDisplay"
    )
    .textContent =
      moves;

}




function flipCard(card) {

  if (
    lock
  ) return;


  if (
    card.classList.contains(
      "completed"
    )
  ) return;


  if (
    selectedCards.includes(
      card
    )
  ) return;


  const img =
    card.querySelector("img");


  img.classList.remove(
    "hidden-image"
  );
  card.classList.add(
  "revealed"
);



  selectedCards.push(
    card
  );


  if (
    selectedCards.length === 2
  ) {

    moves++;


    updateStatus();


    lock =
      true;


    setTimeout(
      checkPair,
      700
    );

  }

}



function checkPair() {

  const card1 =
    selectedCards[0];


  const card2 =
    selectedCards[1];


  const person1 =
    card1.dataset.person;


  const person2 =
    card2.dataset.person;


  /*
  同じ人物なら成功
  */

  if (
    person1 === person2
  ) {

    card1.classList.add(
      "completed"
    );


    card2.classList.add(
      "completed"
    );


    remainingPairs--;


    updateStatus();


    if (
  remainingPairs === 0
) {

  document
    .getElementById("message")
    .innerHTML =
  `
    <div class="clear-box">

      <h2>
        🎉 GAME CLEAR
      </h2>

      <p>
        ${moves}手でクリア
      </p>

      <button
        onclick="startGame()"
      >
        もう一度
      </button>

      <button
        onclick="backToEditor()"
      >
        編集画面へ
      </button>

    </div>
  `;

}


  }

  else {

    card1
  .querySelector("img")
  .classList.add(
    "hidden-image"
  );

card2
  .querySelector("img")
  .classList.add(
    "hidden-image"
  );

card1.classList.remove(
  "revealed"
);

card2.classList.remove(
  "revealed"
);


  }


  selectedCards =
    [];


  lock =
    false;

}



/* 編集画面に戻る */

function backToEditor() {

  document
    .getElementById("game")
    .style.display =
      "none";


  document
    .getElementById("editor")
    .style.display =
      "block";


  document
    .getElementById("message")
    .textContent =
      "";

}

function saveData() {

  localStorage.setItem(
    "people",
    JSON.stringify(
      people
    )
  );

}
loadPeople();



</script>

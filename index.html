<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>人物でそろえる神経衰弱</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   基本
========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    "Noto Sans JP",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #f8f9ff
    );

  color: #222;
  min-height: 100vh;
}

button {
  padding: 11px 18px;
  margin: 5px;

  border: none;
  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #4169e1,
      #6a5acd
    );

  color: white;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 4px 10px
    rgba(65,105,225,.25);
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}


/* =========================================================
   開始画面
========================================================= */

#startScreen {
  position: fixed;
  inset: 0;

  background:
    linear-gradient(
      135deg,
      #4169e1,
      #7b68ee
    );

  display: flex;

  justify-content: center;
  align-items: center;

  z-index: 9999;
}

.start-button {
  font-size: 24px;
  padding: 20px 45px;
  border-radius: 18px;
}


/* =========================================================
   ヘッダー
========================================================= */

header {
  text-align: center;

  padding: 30px 20px 25px;

  background:
    linear-gradient(
      135deg,
      #4169e1,
      #7b68ee
    );

  color: white;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.12);
}

h1 {
  margin: 0 0 8px;
  font-size: 28px;
}


/* =========================================================
   コンテナ
========================================================= */

.container {
  width: min(95%, 1000px);
  margin: 25px auto 50px;
}

.panel {
  background: white;

  padding: 24px;

  border-radius: 20px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.08);

  margin-bottom: 20px;
}


/* =========================================================
   統計
========================================================= */

.stats,
.game-stats {
  display: flex;

  justify-content: center;

  gap: 15px;

  flex-wrap: wrap;

  margin: 20px auto;

  padding: 0 15px;
}

.stat-box,
.stat-card {
  background: white;

  min-width: 130px;

  padding: 15px 20px;

  border-radius: 16px;

  text-align: center;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);
}

.stat-box span,
.stat-card span {
  display: block;

  font-size: 28px;

  font-weight: bold;

  color: #4169e1;
}

small {
  color: #666;
}


/* =========================================================
   入力
========================================================= */

input[type="text"] {
  width: min(300px, 100%);

  padding: 12px 14px;

  font-size: 16px;

  border: 2px solid #ddd;

  border-radius: 10px;

  outline: none;
}

input[type="file"] {
  margin-top: 10px;
  max-width: 100%;
}


/* =========================================================
   人物
========================================================= */

.person {
  background: white;

  border: 1px solid #eee;

  border-radius: 18px;

  padding: 18px;

  margin-top: 18px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.07);
}

.person-header {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;
}

.person-header h3 {
  margin: 0;
}


/* =========================================================
   画像一覧
========================================================= */

.image-list {
  display: flex;

  flex-wrap: wrap;

  gap: 15px;

  margin-top: 18px;
}

.image-box {
  position: relative;

  width: 130px;
}

.image-box img {
  width: 130px;
  height: 130px;

  object-fit: cover;

  border-radius: 14px;

  display: block;

  box-shadow:
    0 3px 10px
    rgba(0,0,0,.15);
}

.image-buttons {
  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  margin-top: 5px;
}

.image-buttons button {
  font-size: 12px;

  padding: 7px 9px;

  margin: 3px;
}

.delete-button {
  background: #e53935;
}

.pending-label {
  display: block;

  text-align: center;

  margin-top: 4px;

  font-size: 11px;

  color: #e67e22;

  font-weight: bold;
}

.pending-box {
  opacity: .9;
}


/* =========================================================
   ゲーム
========================================================= */

.card-board {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(100px, 1fr)
    );

  gap: 12px;

  margin-top: 20px;
}

.card {
  position: relative;

  aspect-ratio: 1 / 1;

  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #4169e1,
      #7b68ee
    );

  cursor: pointer;

  overflow: hidden;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.15);
}

.card::before {
  content: "🃏";

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  color: white;

  font-size: 40px;

  z-index: 2;
}

.card.revealed::before {
  display: none;
}

.card img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

.hidden-image {
  display: none !important;
}

.completed {
  opacity: .45;
  pointer-events: none;
}


/* =========================================================
   メッセージ
========================================================= */

#message {
  text-align: center;

  font-size: 20px;

  margin-top: 25px;
}

.clear-box {
  background:
    linear-gradient(
      135deg,
      #fff,
      #f3f1ff
    );

  padding: 25px;

  border-radius: 20px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.1);
}


/* =========================================================
   切り抜きモーダル
========================================================= */

#cropModal {
  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.82);

  z-index: 10000;

  justify-content: center;

  align-items: center;

  padding: 10px;
}

.crop-dialog {
  width: min(95vw, 700px);

  max-height: 96vh;

  overflow-y: auto;

  background: white;

  border-radius: 20px;

  padding: 20px;

  box-shadow:
    0 10px 50px
    rgba(0,0,0,.4);
}

.crop-dialog h2 {
  margin-top: 0;
}

.crop-area {
  position: relative;

  width: 100%;

  height: min(65vh, 600px);

  overflow: hidden;

  background: #222;

  display: flex;

  justify-content: center;

  align-items: center;

  touch-action: none;

  border-radius: 12px;
}

/*
  重要：
  imgをmax-width/max-heightだけで変形させるのではなく、
  JavaScript側でサイズを設定する。
  これによりズーム時の黒画面問題を防ぐ。
*/

#cropImage {
  position: absolute;

  display: block;

  max-width: none;
  max-height: none;

  width: auto;
  height: auto;

  user-select: none;

  -webkit-user-drag: none;

  transform-origin: center center;

  pointer-events: none;
}

.crop-square {
  position: absolute;

  border: 3px solid white;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,.55);

  cursor: move;

  touch-action: none;

  z-index: 5;
}

.crop-controls {
  margin-top: 15px;

  text-align: center;
}

.crop-controls input[type="range"] {
  width: 80%;
}

.crop-buttons {
  text-align: center;

  margin-top: 10px;
}

.cancel-button {
  background: #777;
}


/* =========================================================
   エラー
========================================================= */

#errorBox {
  display: none;

  margin: 20px;

  padding: 15px;

  background: #ffe5e5;

  color: #b00020;

  border-radius: 10px;

  white-space: pre-wrap;
}


/* =========================================================
   スマホ
========================================================= */

@media (max-width: 600px) {

  header {
    padding: 22px 15px;
  }

  h1 {
    font-size: 22px;
  }

  .panel {
    padding: 16px;
  }

  .card-board {
    grid-template-columns:
      repeat(3, 1fr);

    gap: 8px;
  }

  .image-box {
    width: 100px;
  }

  .image-box img {
    width: 100px;
    height: 100px;
  }

  .crop-dialog {
    padding: 15px;
  }

  .crop-area {
    height: 55vh;
  }

  .crop-controls input[type="range"] {
    width: 95%;
  }

}

</style>
</head>


<body>


<!-- =========================================================
     開始画面
========================================================= -->

<div id="startScreen">

  <button
    class="start-button"
    onclick="enterSite()"
  >
    🎮 始める
  </button>

</div>


<!-- =========================================================
     エラー表示
========================================================= -->

<div id="errorBox"></div>


<header>

  <h1>
    人物でそろえる神経衰弱
  </h1>

  <p>
    画像が違っても同じ人物ならペア！
  </p>

</header>


<!-- =========================================================
     統計
========================================================= -->

<div class="stats">

  <div class="stat-box">

    <span id="personCount">
      0
    </span>

    <small>
      人物数
    </small>

  </div>


  <div class="stat-box">

    <span id="imageCount">
      0
    </span>

    <small>
      画像数
    </small>

  </div>

</div>


<div class="container">


<!-- =========================================================
     編集画面
========================================================= -->

<div
  id="editor"
  class="panel"
>

  <h2>
    人物・画像一覧
  </h2>


  <div>

    <input
      type="text"
      id="personName"
      placeholder="人物名を入力"
    >

    <button
      onclick="addPerson()"
    >
      ＋ 人物を追加
    </button>

  </div>


  <div id="personList"></div>


  <hr>


  <button
    onclick="startGame()"
  >
    🎮 ゲーム開始
  </button>

</div>


<!-- =========================================================
     ゲーム画面
========================================================= -->

<div
  id="game"

>

  <button
    onclick="backToEditor()"
  >

  </button>


  <h2>
    神経衰弱
  </h2>


  <div class="game-stats">

    <div class="stat-card">

      <span id="remainingDisplay">
        0
      </span>

      <small>
        残り組数
      </small>

    </div>


    <div class="stat-card">

      <span id="movesDisplay">
        0
      </span>

      <small>
        挑戦回数
      </small>

    </div>

  </div>


  <div
    id="board"
    class="card-board"
  ></div>


  <div id="message"></div>

</div>


</div>


<!-- =========================================================
     切り抜き画面
========================================================= -->

<div id="cropModal">

  <div class="crop-dialog">

    <h2>
      ✂️ 正方形に切り抜く
    </h2>

    <p>
      白い四角をドラッグして、表示したい部分を選択してください。
    </p>


    <div
      id="cropArea"
      class="crop-area"
    >

      <img
        id="cropImage"
        draggable="false"
      >

      <div
        id="cropSquare"
        class="crop-square"
      ></div>

    </div>


    <div class="crop-controls">

      <label>
        ズーム
      </label>

      <br>

        id="zoomRange"

      >

    </div>


    <div class="crop-buttons">

      <button
        class="cancel-button"

      >
        キャンセル
      </button>

      <button
        onclick="saveCrop()"
      >
        ✂️ この範囲で保存
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   エラー監視
========================================================= */

window.addEventListener(
  "error",
  function(e) {

    showError(
      "JavaScript ERROR\n\n" +
      e.message +
      "\n\nLINE: " +
      e.lineno
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  function(e) {

    showError(
      "Promise ERROR\n\n" +
      e.reason
    );

  }
);


function showError(message) {

  console.error(message);

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display = "block";

  box.textContent = message;

}


/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "https://zuwhkhsviqfitfzpgcdy.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_E09QP-l02lAr14I3p04wHg_2-1nE1TM";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   データ
========================================================= */

let people = [];

let selectedCards = [];

let lock = false;

let remainingPairs = 0;

let moves = 0;


/* =========================================================
   未切り抜き画像
========================================================= */

/*
  Supabaseにまだ保存していない、
  一時的な画像をここに保持する。

  personIdごとに配列で管理。
*/

let pendingImages = {};


/* =========================================================
   切り抜き用データ
========================================================= */

let cropState = {

  mode: "new",

  person: null,

  image: null,

  file: null,

  imageDataUrl: null,

  sourceImage: null,

  originalDisplayWidth: 0,

  originalDisplayHeight: 0,

  baseScale: 1,

  zoom: 1,

  imageLeft: 0,

  imageTop: 0,

  squareLeft: 0,

  squareTop: 0,

  squareSize: 0,

  dragging: false,

  startX: 0,

  startY: 0,

  startSquareLeft: 0,

  startSquareTop: 0

};


/* =========================================================
   サイト開始
========================================================= */

async function enterSite() {

  document
    .getElementById(
      "startScreen"
    )
    .style.display =
    "none";


  await loadPeople();

}


/* =========================================================
   人物・画像読み込み
========================================================= */

async function loadPeople() {

  try {

    const {
      data: peopleData,
      error: peopleError
    } =
      await supabaseClient
        .from("people")
        .select("*")
        .order(
          "id",
          {
            ascending: true
          }
        );


    if (peopleError) {

      console.error(
        peopleError
      );

      showError(
        "人物データの読み込みエラー\n\n" +
        peopleError.message
      );

      return;

    }


    const {
      data: imageData,
      error: imageError
    } =
      await supabaseClient
        .from("person_images")
        .select("*");


    if (imageError) {

      console.error(
        imageError
      );

      showError(
        "画像データの読み込みエラー\n\n" +
        imageError.message
      );

      return;

    }


    people =
      (peopleData || []).map(
        person => {

          const images =
            (imageData || [])
              .filter(
                image =>
                  String(image.person_id) ===
                  String(person.id)
              )
              .map(
                image => {

                  const {
                    data
                  } =
                    supabaseClient
                      .storage
                      .from("images")
                      .getPublicUrl(
                        image.image_path
                      );


                  return {

                    id:
                      image.id,

                    path:
                      image.image_path,

                    url:
                      data.publicUrl

                  };

                }
              );


          return {

            ...person,

            images:
              images

          };

        }
      );


    renderPeople();


  }

  catch(error) {

    console.error(error);

    showError(
      "データ読み込み中にエラーが発生しました\n\n" +
      error.message
    );

  }

}


/* =========================================================
   人物追加
========================================================= */

async function addPerson() {

  const input =
    document.getElementById(
      "personName"
    );


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "人物名を入力してください"
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("people")
      .insert({

        name:
          name

      });


  if (error) {

    alert(
      "人物の追加に失敗しました\n\n" +
      error.message
    );

    return;

  }


  input.value = "";


  await loadPeople();

}


/* =========================================================
   人物削除
========================================================= */

async function deletePerson(person) {

  if (
    !confirm(
      `「${person.name}」を削除しますか？`
    )
  ) {

    return;

  }


  /*
    保留中画像も削除
  */

  delete pendingImages[
    person.id
  ];


  const paths =
    person.images.map(
      image =>
        image.path
    );


  if (paths.length > 0) {

    const {
      error
    } =
      await supabaseClient
        .storage
        .from("images")
        .remove(
          paths
        );


    if (error) {

      console.error(
        "Storage delete error",
        error
      );

    }

  }


  const {
    error
  } =
    await supabaseClient
      .from("person_images")
      .delete()
      .eq(
        "person_id",
        person.id
      );


  if (error) {

    alert(
      "画像情報の削除に失敗しました\n\n" +
      error.message
    );

    return;

  }


  const {
    error: personError
  } =
    await supabaseClient
      .from("people")
      .delete()
      .eq(
        "id",
        person.id
      );


  if (personError) {

    alert(
      "人物の削除に失敗しました\n\n" +
      personError.message
    );

    return;

  }


  await loadPeople();

}


/* =========================================================
   画像一覧表示
========================================================= */

function renderPeople() {

  const list =
    document.getElementById(
      "personList"
    );


  list.innerHTML = "";


  people.forEach(
    person => {

      const personDiv =
        document.createElement(
          "div"
        );


      personDiv.className =
        "person";


      /* -------------------------
         ヘッダー
      ------------------------- */

      const header =
        document.createElement(
          "div"
        );


      header.className =
        "person-header";


      const title =
        document.createElement(
          "h3"
        );


      const pendingCount =
        (
          pendingImages[person.id] ||
          []
        ).length;


      title.textContent =
        `${person.name}（画像 ${
          person.images.length +
          pendingCount
        }枚）`;


      header.appendChild(
        title
      );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.textContent =
        "人物を削除";


      deleteButton.className =
        "delete-button";


      deleteButton.onclick =
        () =>
          deletePerson(
            person
          );


      header.appendChild(
        deleteButton
      );


      personDiv.appendChild(
        header
      );


      /* -------------------------
         画像追加
      ------------------------- */

      const fileInput =
        document.createElement(
          "input"
        );


      fileInput.type =
        "file";

      fileInput.accept =
        "image/*";

      fileInput.multiple =
        true;


      fileInput.onchange =
        async function(e) {

          const files =
            Array.from(
              e.target.files
            );


          if (!files.length) {
            return;
          }


          await addPendingImages(
            person,
            files
          );


          /*
            同じファイルを再選択できるようにする
          */

          fileInput.value = "";

        };


      personDiv.appendChild(
        fileInput
      );


      /* -------------------------
         画像一覧
      ------------------------- */

      const imageList =
        document.createElement(
          "div"
        );


      imageList.className =
        "image-list";


      /* -------------------------
         保存済み画像
      ------------------------- */

      person.images.forEach(
        image => {

          createSavedImageBox(
            imageList,
            person,
            image
          );

        }
      );


      /* -------------------------
         未切り抜き画像
      ------------------------- */

      const pending =
        pendingImages[person.id] ||
        [];


      pending.forEach(
        pendingImage => {

          createPendingImageBox(
            imageList,
            person,
            pendingImage
          );

        }
      );


      personDiv.appendChild(
        imageList
      );


      list.appendChild(
        personDiv
      );

    }
  );


  updateCounts();

}


/* =========================================================
   保存済み画像BOX
========================================================= */

function createSavedImageBox(
  imageList,
  person,
  image
) {

  const imageBox =
    document.createElement(
      "div"
    );


  imageBox.className =
    "image-box";


  const img =
    document.createElement(
      "img"
    );


  img.src =
    image.url;


  img.onerror =
    function() {

      img.alt =
        "画像を読み込めません";

    };


  imageBox.appendChild(
    img
  );


  const buttons =
    document.createElement(
      "div"
    );


  buttons.className =
    "image-buttons";


  /* 切り抜き変更 */

  const cropButton =
    document.createElement(
      "button"
    );


  cropButton.textContent =
    "✂️ 切り抜き";


  cropButton.onclick =
    () =>
      openCropForExistingImage(
        person,
        image
      );


  buttons.appendChild(
    cropButton
  );


  /* 削除 */

  const deleteImageButton =
    document.createElement(
      "button"
    );


  deleteImageButton.textContent =
    "× 削除";


  deleteImageButton.className =
    "delete-button";


  deleteImageButton.onclick =
    () =>
      deleteImage(
        image
      );


  buttons.appendChild(
    deleteImageButton
  );


  imageBox.appendChild(
    buttons
  );


  imageList.appendChild(
    imageBox
  );

/* =========================================================
   複数画像を一括追加
========================================================= */

async function addPendingImages(
  person,
  files
) {

  if (
    !pendingImages[person.id]
  ) {

    pendingImages[person.id] =
      [];

  }


  for (
    const file
    of files
  ) {

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      continue;

    }


    try {

      const dataUrl =
        await fileToDataURL(
          file
        );


      /*
        画像表示用URL
      */

      const previewUrl =
        dataUrl;


      pendingImages[
        person.id
      ].push({

        id:
          crypto.randomUUID
          ? crypto.randomUUID()
          : String(
              Date.now() +
              Math.random()
            ),

        file:
          file,

        dataUrl:
          dataUrl,

        previewUrl:
          previewUrl

      });

    }

    catch(error) {

      console.error(
        error
      );

      alert(
        `${file.name} の読み込みに失敗しました`
      );

    }

  }


  renderPeople();

}


/* =========================================================
   未切り抜き画像削除
========================================================= */

function deletePendingImage(
  person,
  pendingImage
) {

  if (
    !confirm(
      "この画像を削除しますか？"
    )
  ) {

    return;

  }


  pendingImages[person.id] =
    (
      pendingImages[person.id] ||
      []
    ).filter(
      image =>
        image.id !==
        pendingImage.id
    );


  renderPeople();

}

  const savedCount =

    );


  const pendingCount =

/* =========================================================
   File → Data URL
========================================================= */

function fileToDataURL(file) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        () =>
          reject(
            reader.error
          );


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   Data URL → Image
========================================================= */

function loadImageFromDataURL(
  dataUrl
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();


      img.onload =
        () =>
          resolve(
            img
          );


      img.onerror =
        () =>
          reject(
            new Error(
              "画像を読み込めませんでした"
            )
          );


      img.src =
        dataUrl;

    }
  );

}


/* =========================================================
   未切り抜き画像を切り抜き
========================================================= */

) {

      imageLeft:

      imageTop:

      squareLeft:

      squareTop:
        0,

      squareSize:

      startX:

function showCropModal() {

  const modal =

  */

/* =========================================================
   切り抜きエリア初期化
========================================================= */

function setupCropArea() {

  const area =
    document.getElementById(
      "cropArea"
    );


  const image =
    document.getElementById(
      "cropImage"
    );


  const square =
    document.getElementById(
      "cropSquare"
    );


  if (
    !cropState.sourceImage
  ) {

    return;

  }


  const areaWidth =
    area.clientWidth;


  const areaHeight =
    area.clientHeight;


  const naturalWidth =
    cropState.sourceImage.naturalWidth;


  const naturalHeight =
    cropState.sourceImage.naturalHeight;


  /*
    元画像を「できるだけ大きく」表示。
    以前より元画像に近いサイズ。
  */

  const fitScale =
    Math.min(
      areaWidth / naturalWidth,
      areaHeight / naturalHeight
    );


  /*
    小さすぎる画像にならないようにする
  */

  const displayScale =
    Math.max(
      fitScale,
      0.01
    );


  cropState.baseScale =
    displayScale;


  cropState.zoom =
    1;


  cropState.originalDisplayWidth =
    naturalWidth *
    displayScale;


  cropState.originalDisplayHeight =
    naturalHeight *
    displayScale;


  cropState.imageLeft =
    (
      areaWidth -
      cropState.originalDisplayWidth
    ) / 2;


  cropState.imageTop =
    (
      areaHeight -
      cropState.originalDisplayHeight
    ) / 2;


  /*
    正方形のサイズ
  */

  const squareSize =
    Math.min(
      cropState.originalDisplayWidth,
      cropState.originalDisplayHeight
    ) * 0.65;


  cropState.squareSize =
    squareSize;


  cropState.squareLeft =
    cropState.imageLeft +
    (
      cropState.originalDisplayWidth -
      squareSize
    ) / 2;


  cropState.squareTop =
    cropState.imageTop +
    (
      cropState.originalDisplayHeight -
      squareSize
    ) / 2;


  square.style.width =
    squareSize + "px";


  square.style.height =
    squareSize + "px";


  updateCropDisplay();

}


/* =========================================================
   切り抜き表示更新
========================================================= */

function updateCropDisplay() {

  const image =
    document.getElementById(
      "cropImage"
    );


  const square =
    document.getElementById(
      "cropSquare"
    );


  const scale =
    cropState.baseScale *
    cropState.zoom;


  const width =
    cropState.sourceImage.naturalWidth *
    scale;


  const height =
    cropState.sourceImage.naturalHeight *
    scale;


  /*
    ズーム時は中心を基準にする
  */

  const area =
    document.getElementById(
      "cropArea"
    );


  const centerX =
    area.clientWidth / 2;


  const centerY =
    area.clientHeight / 2;


  /*
    初期位置を中心基準で計算
  */

  const newLeft =
    centerX -
    width / 2;


  const newTop =
    centerY -
    height / 2;


  /*
    ズーム時に切り抜き位置が
    大きく飛ばないように補正
  */

  if (
    cropState.zoom === 1
  ) {

    cropState.imageLeft =
      newLeft;

    cropState.imageTop =
      newTop;

  }


  image.style.width =
    width + "px";


  image.style.height =
    height + "px";


  image.style.left =
    cropState.imageLeft + "px";


  image.style.top =
    cropState.imageTop + "px";


  square.style.left =
    cropState.squareLeft + "px";


  square.style.top =
    cropState.squareTop + "px";


  /*
    四角が画像外に出ないよう補正
  */

  constrainCropSquare();

}


/* =========================================================
   切り抜き四角の範囲補正
========================================================= */

function constrainCropSquare() {

  const image =
    document.getElementById(
      "cropImage"
    );


  const imageLeft =
    cropState.imageLeft;


  const imageTop =
    cropState.imageTop;


  const imageWidth =
    image.offsetWidth;


  const imageHeight =
    image.offsetHeight;


  const size =
    cropState.squareSize;


  const minLeft =
    imageLeft;


  const minTop =
    imageTop;


  const maxLeft =
    imageLeft +
    imageWidth -
    size;


  const maxTop =
    imageTop +
    imageHeight -
    size;


  cropState.squareLeft =
    Math.max(
      minLeft,
      Math.min(
        maxLeft,
        cropState.squareLeft
      )
    );


  cropState.squareTop =
    Math.max(
      minTop,
      Math.min(
        maxTop,
        cropState.squareTop
      )
    );


  const square =
    document.getElementById(
      "cropSquare"
    );


  square.style.left =
    cropState.squareLeft + "px";


  square.style.top =
    cropState.squareTop + "px";

}


/* =========================================================
   切り抜き四角ドラッグ
========================================================= */

const cropSquare =
  document.getElementById(
    "cropSquare"
  );


cropSquare.addEventListener(
  "pointerdown",
  function(e) {

    e.preventDefault();

    cropState.dragging =
      true;

    cropState.startX =
      e.clientX;

    cropState.startY =
      e.clientY;

    cropState.startSquareLeft =
      cropState.squareLeft;

    cropState.startSquareTop =
      cropState.squareTop;


    cropSquare.setPointerCapture(
      e.pointerId
    );

  }
);


cropSquare.addEventListener(
  "pointermove",
  function(e) {

    if (
      !cropState.dragging
    ) {

      return;

    }


    const dx =
      e.clientX -
      cropState.startX;


    const dy =
      e.clientY -
      cropState.startY;


    cropState.squareLeft =
      cropState.startSquareLeft +
      dx;


    cropState.squareTop =
      cropState.startSquareTop +
      dy;


    constrainCropSquare();

  }
);


cropSquare.addEventListener(
  "pointerup",
  function() {

    cropState.dragging =
      false;

  }
);


cropSquare.addEventListener(
  "pointercancel",
  function() {

    cropState.dragging =
      false;

  }
);


/* =========================================================
   ズーム
========================================================= */

document
  .getElementById(
    "zoomRange"
  )
  .addEventListener(
    "input",
    function() {

      const oldZoom =
        cropState.zoom;


      const newZoom =
        parseFloat(
          this.value
        );


      /*
        現在の四角の中心を維持
      */

      const squareCenterX =
        cropState.squareLeft +
        cropState.squareSize / 2;


      const squareCenterY =
        cropState.squareTop +
        cropState.squareSize / 2;


      const area =
        document.getElementById(
          "cropArea"
        );


      const centerX =
        area.clientWidth / 2;


      const centerY =
        area.clientHeight / 2;


      const oldImageWidth =
        cropState.sourceImage.naturalWidth *
        cropState.baseScale *
        oldZoom;


      const oldImageHeight =
        cropState.sourceImage.naturalHeight *
        cropState.baseScale *
        oldZoom;


      /*
        画像中心から四角中心までの距離
      */

      const relativeX =
        squareCenterX -
        centerX;


      const relativeY =
        squareCenterY -
        centerY;


      /*
        ズームによって画像位置を変更
      */

      const ratio =
        newZoom /
        oldZoom;


      cropState.imageLeft =
        centerX +
        (
          cropState.imageLeft -
          centerX
        ) * ratio;


      cropState.imageTop =
        centerY +
        (
          cropState.imageTop -
          centerY
        ) * ratio;


      /*
        四角位置も画像中心基準で維持
      */

      cropState.squareLeft =
        centerX +
        relativeX * ratio -
        cropState.squareSize / 2;


      cropState.squareTop =
        centerY +
        relativeY * ratio -
        cropState.squareSize / 2;


      cropState.zoom =
        newZoom;


      /*
        実際の画像位置を維持するため、
        updateCropDisplayではimageLeft/imageTopを使う。
      */

      const image =
        document.getElementById(
          "cropImage"
        );


      const width =
        cropState.sourceImage.naturalWidth *
        cropState.baseScale *
        newZoom;


      const height =
        cropState.sourceImage.naturalHeight *
        cropState.baseScale *
        newZoom;


      image.style.width =
        width + "px";


      image.style.height =
        height + "px";


      image.style.left =
        cropState.imageLeft + "px";


      image.style.top =
        cropState.imageTop + "px";


      document
        .getElementById(
          "cropSquare"
        )
        .style.left =
        cropState.squareLeft + "px";


      document
        .getElementById(
          "cropSquare"
        )
        .style.top =
        cropState.squareTop + "px";


      constrainCropSquare();


      document
        .getElementById(
          "zoomText"
        )
        .textContent =
        Math.round(
          newZoom * 100
        ) + "%";

    }
  );

/* =========================================================
   正方形切り抜き
========================================================= */

async function createCroppedBlob() {

  const image =
    cropState.sourceImage;


  if (!image) {

    throw new Error(
      "元画像がありません"
    );

  }


  /*
    表示上の画像
  */

  const displayScale =
    cropState.baseScale *
    cropState.zoom;


  /*
    四角の左上位置を
    元画像座標へ変換
  */

  let sx =
    (
      cropState.squareLeft -
      cropState.imageLeft
    ) /
    displayScale;


  let sy =
    (
      cropState.squareTop -
      cropState.imageTop
    ) /
    displayScale;


  let size =
    cropState.squareSize /
    displayScale;


  /*
    範囲補正
  */

  sx =
    Math.max(
      0,
      Math.min(
        image.naturalWidth -
        size,
        sx
      )
    );


  sy =
    Math.max(
      0,
      Math.min(
        image.naturalHeight -
        size,
        sy
      )
    );


  size =
    Math.min(
      size,
      image.naturalWidth -
      sx,
      image.naturalHeight -
      sy
    );


  if (
    size <= 0
  ) {

    throw new Error(
      "切り抜き範囲が不正です"
    );

  }


  /*
    出力サイズ
  */

  const outputSize =
    800;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    outputSize;


  canvas.height =
    outputSize;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.imageSmoothingEnabled =
    true;


  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    image,

    sx,
    sy,
    size,
    size,

    0,
    0,
    outputSize,
    outputSize

  );


  return new Promise(
    (
      resolve,
      reject
    ) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                "画像の生成に失敗しました"
              )
            );

            return;

          }


          resolve(blob);

        },
        "image/jpeg",
        0.5
      );

    }
  );

}


/* =========================================================
   切り抜き保存
========================================================= */

async function saveCrop() {

  const saveButton =
    document.querySelector(
      "#cropModal .crop-buttons button:last-child"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "保存中...";


  try {

    const blob =
      await createCroppedBlob();


    /*
    =========================
    保留画像
    =========================
    */

    if (
      cropState.mode ===
      "pending"
    ) {

      const person =
        cropState.person;


      const pendingImage =
        cropState.image;


      const fileName =
        `${person.id}/${Date.now()}-${Math.random()
          .toString(36)
          .substring(2)}.jpg`;


      const {
        error:
          uploadError
      } =
      await supabaseClient
        .storage
        .from("images")
        .upload(
          fileName,
          blob,
          {

            contentType:
              "image/jpeg",

            upsert:
              false

          }
        );


      if (uploadError) {

        throw uploadError;

      }


      const {
        error:
          dbError
      } =
      await supabaseClient
        .from("person_images")
        .insert({

          person_id:
            person.id,

          image_path:
            fileName

        });


      if (dbError) {

        await supabaseClient
          .storage
          .from("images")
          .remove([
            fileName
          ]);

        throw dbError;

      }


      /*
        保留中リストから削除
      */

      pendingImages[
        person.id
      ] =
        (
          pendingImages[
            person.id
          ] || []
        ).filter(
          image =>
            image.id !==
            pendingImage.id
        );

    }


    /*
    =========================
    新規画像
    =========================
    */

    else if (
      cropState.mode ===
      "new"
    ) {

      const person =
        cropState.person;


      const fileName =
        `${person.id}/${Date.now()}-${Math.random()
          .toString(36)
          .substring(2)}.jpg`;


      const {
        error:
          uploadError
      } =
      await supabaseClient
        .storage
        .from("images")
        .upload(
          fileName,
          blob,
          {

            contentType:
              "image/jpeg",

            upsert:
              false

          }
        );


      if (uploadError) {

        throw uploadError;

      }


      const {
        error:
          dbError
      } =
      await supabaseClient
        .from("person_images")
        .insert({

          person_id:
            person.id,

          image_path:
            fileName

        });


      if (dbError) {

        await supabaseClient
          .storage
          .from("images")
          .remove([
            fileName
          ]);

        throw dbError;

      }

    }


    /*
    =========================
    既存画像
    =========================
    */

    else if (
      cropState.mode ===
      "existing"
    ) {

      const oldImage =
        cropState.image;


      const newFileName =
        `${cropState.person.id}/${Date.now()}-${Math.random()
          .toString(36)
          .substring(2)}.jpg`;


      const {
        error:
          uploadError
      } =
      await supabaseClient
        .storage
        .from("images")
        .upload(
          newFileName,
          blob,
          {

            contentType:
              "image/jpeg",

            upsert:
              false

          }
        );


      if (uploadError) {

        throw uploadError;

      }


      const {
        error:
          updateError
      } =
      await supabaseClient
        .from("person_images")
        .update({

          image_path:
            newFileName

        })
        .eq(
          "id",
          oldImage.id
        );


      if (updateError) {

        await supabaseClient
          .storage
          .from("images")
          .remove([
            newFileName
          ]);

        throw updateError;

      }


      const {
        error:
          oldDeleteError
      } =
      await supabaseClient
        .storage
        .from("images")
        .remove([
          oldImage.path
        ]);


      if (oldDeleteError) {

        console.warn(
          "古い画像削除失敗",
          oldDeleteError
        );

      }

    }


    closeCropModal();


    await loadPeople();


  }

  catch(error) {

    console.error(error);

    alert(
      "画像の保存に失敗しました\n\n" +
      error.message
    );

  }

  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      "✂️ この範囲で保存";

  }

}


/* =========================================================
   画像削除
========================================================= */

async function deleteImage(image) {

  if (
    !confirm(
      "この画像を削除しますか？"
    )
  ) {

    return;

  }


  const {
    error:
      storageError
  } =
  await supabaseClient
    .storage
    .from("images")
    .remove([
      image.path
    ]);


  if (storageError) {

    alert(
      "Storage画像の削除に失敗しました\n\n" +
      storageError.message
    );

    return;

  }


  const {
    error:
      dbError
  } =
  await supabaseClient
    .from("person_images")
    .delete()
    .eq(
      "id",
      image.id
    );


  if (dbError) {

    alert(
      "画像情報の削除に失敗しました\n\n" +
      dbError.message
    );

    return;

  }


  await loadPeople();

}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(array) {

  for (
    let i =
      array.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================================================
   ゲーム開始
========================================================= */

function startGame() {

  /*
    未切り抜き画像が残っている場合
  */

  const pendingCount =
    Object.values(
      pendingImages
    ).reduce(
      (
        total,
        images
      ) =>
        total +
        images.length,
      0
    );


  if (
    pendingCount > 0
  ) {

    alert(
      "まだ切り抜いていない画像があります。\n\n" +
      "ゲームを開始する前に、画像の「✂️ 切り抜き」を完了してください。"
    );

    return;

  }


  const usablePeople =
    people.filter(
      person =>
        person.images.length >= 2
    );


  if (
    usablePeople.length === 0
  ) {

    alert(
      "最低1人、画像を2枚以上登録してください。"
    );

    return;

  }


  let cards = [];


  usablePeople.forEach(
    person => {

      const images =
        shuffle(
          [...person.images]
        );


      const selected =
        images.slice(
          0,
          2
        );


      selected.forEach(
        image => {

          cards.push({

            person:
              person.name,

            image:
              image.url

          });

        }
      );

    }
  );


  shuffle(cards);


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "game"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";


  const board =
    document.getElementById(
      "board"
    );


  board.innerHTML =
    "";


  selectedCards = [];

  lock = false;

  moves = 0;

  remainingPairs =
    usablePeople.length;


  updateStatus();


  cards.forEach(
    card => {

      const cardElement =
        document.createElement(
          "div"
        );


      cardElement.className =
        "card";


      cardElement.dataset.person =
        card.person;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        card.image;


      img.className =
        "hidden-image";


      cardElement.appendChild(
        img
      );


      cardElement.onclick =
        () =>
          flipCard(
            cardElement
          );


      board.appendChild(
        cardElement
      );

    }
  );

}


/* =========================================================
   ステータス
========================================================= */

function updateStatus() {

  document
    .getElementById(
      "remainingDisplay"
    )
    .textContent =
    remainingPairs;


  document
    .getElementById(
      "movesDisplay"
    )
    .textContent =
    moves;

}


/* =========================================================
   カードをめくる
========================================================= */

function flipCard(card) {

  if (lock) {
    return;
  }


  if (
    card.classList.contains(
      "completed"
    )
  ) {
    return;
  }


  if (
    selectedCards.includes(
      card
    )
  ) {
    return;
  }


  const img =
    card.querySelector(
      "img"
    );


  img.classList.remove(
    "hidden-image"
  );


  card.classList.add(
    "revealed"
  );


  selectedCards.push(
    card
  );


  if (
    selectedCards.length === 2
  ) {

    moves++;

    updateStatus();

    lock = true;


    setTimeout(
      checkPair,
      800
    );

  }

}


/* =========================================================
   ペア判定
========================================================= */

function checkPair() {

  const card1 =
    selectedCards[0];


  const card2 =
    selectedCards[1];


  if (!card1 || !card2) {

    selectedCards = [];

    lock = false;

    return;

  }


  const person1 =
    card1.dataset.person;


  const person2 =
    card2.dataset.person;


  if (
    person1 === person2
  ) {

    card1.classList.add(
      "completed"
    );


    card2.classList.add(
      "completed"
    );


    remainingPairs--;


    updateStatus();


    if (
      remainingPairs === 0
    ) {

      document
        .getElementById(
          "message"
        )
        .innerHTML = `

          <div class="clear-box">

            <h2>
              🎉 GAME CLEAR！
            </h2>

            <p>
              ${moves}回でクリアしました！
            </p>

            <button
              onclick="startGame()"
            >
              もう一度遊ぶ
            </button>

            <button
              onclick="backToEditor()"
            >
              編集画面へ
            </button>

          </div>

        `;

    }

  }

  else {

    card1
      .querySelector("img")
      .classList.add(
        "hidden-image"
      );


    card2
      .querySelector("img")
      .classList.add(
        "hidden-image"
      );


    card1.classList.remove(
      "revealed"
    );


    card2.classList.remove(
      "revealed"
    );

  }


  selectedCards = [];

  lock = false;

}


/* =========================================================
   編集画面に戻る
========================================================= */

function backToEditor() {

  document
    .getElementById(
      "game"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "editor"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .innerHTML =
    "";

}

    }

  }
);
